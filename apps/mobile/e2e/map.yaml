appId: travel.planned.app
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_MAP_TRIP_TITLE}
- tapOn: "Create"
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Map view"
    timeout: 15000
- assertVisible: "Itinerary"
- tapOn: "Add a place"
- inputText: "Map-critical place"
- tapOn: "Place"
- extendedWaitUntil:
    visible: "Map-critical place"
    timeout: 10000
- assertVisible: "Map view"
