appId: travel.planned.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: 92%, 93%
- runFlow:
    when:
      visible: "‹ Trips"
    commands:
      - tapOn: "‹ Trips"
- runFlow:
    when:
      visible: "sign-out"
    commands:
      - tapOn: "sign-out"
- runFlow:
    when:
      visible: "Your trips"
    commands:
      - tapOn:
          id: sign-out
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_MAP_TRIP_TITLE}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Map view"
    timeout: 15000
- assertVisible: "Itinerary"
- tapOn: "Add a place"
- inputText: "Map-critical place"
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Map-critical place"
    timeout: 10000
- assertVisible: "Map view"

