appId: travel.planned.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "‹ Trips"
    commands:
      - tapOn: "‹ Trips"
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn: "Sign out"
- runFlow:
    when:
      visible: "Your trips"
    commands:
      - scrollUntilVisible:
          element: "Sign out"
          direction: DOWN
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_REALTIME_TRIP_TITLE}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Live"
    timeout: 15000
- assertVisible: "1 online"
- tapOn: "Add a note"
- inputText: "Realtime refresh note"
- pressKey: ENTER
- assertVisible: "Realtime refresh note"
