appId: travel.planned.app
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_REALTIME_TRIP_TITLE}
- tapOn: "Create"
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Live"
    timeout: 15000
- assertVisible: "1 online"
- tapOn: "Add a note"
- inputText: "Realtime refresh note"
- tapOn: "Add"
- assertVisible: "Realtime refresh note"
