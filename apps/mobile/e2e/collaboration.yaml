appId: travel.planned.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "‹ Trips"
    commands:
      - tapOn: "‹ Trips"
      - waitForAnimationToEnd
- repeat:
    times: 20
    commands:
      - swipe:
          direction: UP
          duration: 500
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn:
          id: sign-out
- runFlow:
    when:
      visible: "Your trips"
    commands:
      - scrollUntilVisible:
          element:
            id: sign-out
          direction: DOWN
      - tapOn:
          id: sign-out
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_COLLAB_TRIP_TITLE}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- assertVisible: "owner"
- tapOn:
    id: member-email
- inputText: ${E2E_MEMBER_EMAIL}
- pressKey: ENTER
- extendedWaitUntil:
    visible: ${E2E_MEMBER_EMAIL}
    timeout: 10000
- tapOn: "Done"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_MEMBER_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- assertVisible: "Add a note"
- tapOn: "Add a note"
- inputText: "Editor collaboration note"
- pressKey: ENTER
- assertVisible: "Editor collaboration note"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- tapOn: "Viewer"
- tapOn: "Done"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_MEMBER_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "View-only access"
    timeout: 15000
- assertNotVisible: "Add a note"
