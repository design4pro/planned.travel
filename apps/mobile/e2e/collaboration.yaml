appId: travel.planned.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: 92%, 93%
- runFlow:
    when:
      visible: "‹ Trips"
    commands:
      - tapOn: "‹ Trips"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "sign-out"
    commands:
      - tapOn: "sign-out"
- runFlow:
    when:
      visible: "Your trips"
    commands:
      - tapOn:
          id: sign-out
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_COLLAB_TRIP_TITLE}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- assertVisible: "owner"
- tapOn:
    id: member-email
- inputText: ${E2E_MEMBER_EMAIL}
- pressKey: ENTER
- extendedWaitUntil:
    visible: ${E2E_MEMBER_EMAIL}
    timeout: 10000
- tapOn: "Done"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_MEMBER_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn:
    id: open-latest-trip
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- assertVisible: "Add a note"
- tapOn: "Add a note"
- inputText: "Editor collaboration note"
- pressKey: ENTER
- assertVisible: "Editor collaboration note"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn:
    id: open-latest-trip
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- tapOn:
    id: role-viewer
- extendedWaitUntil:
    visible: "viewer"
    timeout: 10000
- tapOn: "Done"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
- assertVisible: "Sign in"
- tapOn:
    id: sign-in-email
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_MEMBER_PASSWORD}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn:
    id: open-latest-trip
- assertVisible:
    id: trip-role
