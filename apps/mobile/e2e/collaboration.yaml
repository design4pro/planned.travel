appId: travel.planned.app
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_COLLAB_TRIP_TITLE}
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Open trip →"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- assertVisible: "owner"
- tapOn: "Member email"
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn: "Invite"
- extendedWaitUntil:
    visible: ${E2E_MEMBER_EMAIL}
    timeout: 10000
- tapOn: "Done"
- tapOn: "Sign out"
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_MEMBER_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- assertVisible: "Add a note"
- tapOn: "Add a note"
- inputText: "Editor collaboration note"
- tapOn: "Add"
- assertVisible: "Editor collaboration note"
- tapOn: "‹ Trips"
- tapOn: "Sign out"
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- tapOn: "People"
- extendedWaitUntil:
    visible: "Collaborators"
    timeout: 10000
- tapOn: "Viewer"
- tapOn: "Done"
- tapOn: "Sign out"
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: ${E2E_MEMBER_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_MEMBER_PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Open trip →"
- extendedWaitUntil:
    visible: "View-only access"
    timeout: 15000
- assertNotVisible: "Add a note"
