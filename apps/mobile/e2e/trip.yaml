appId: travel.planned.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Nie teraz"
    commands:
      - tapOn: "Nie teraz"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: 92%, 93%
- runFlow:
    when:
      visible: "‹ Trips"
    commands:
      - tapOn: "‹ Trips"
- runFlow:
    when:
      visible: "sign-out"
    commands:
      - tapOn: "sign-out"
- runFlow:
    when:
      visible: "Your trips"
    commands:
      - tapOn:
          id: sign-out
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- waitForAnimationToEnd
- inputText: ${E2E_PASSWORD}
- waitForAnimationToEnd
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Your trips"
    timeout: 15000
- tapOn: "Name a new trip"
- inputText: ${E2E_TRIP_TITLE}
- pressKey: ENTER
- extendedWaitUntil:
    visible: "Itinerary"
    timeout: 15000
- assertVisible: "Map view"
- tapOn: "Add a note"
- inputText: "Mobile E2E note"
- pressKey: ENTER
- assertVisible: "Mobile E2E note"
- tapOn: "‹ Trips"
- tapOn:
    id: sign-out
