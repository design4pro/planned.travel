name: Idea
description: A new capability. Goes to the backlog, then through a plan run (spec, PRD, tickets).
labels: ['type: feature', 'status: backlog']
body:
  - type: markdown
    attributes:
      value: |
        Ideas skip triage. When it is time, a human hands the issue to the `plan` workflow, which
        grills the idea into a spec, then a PRD, then tickets. Write what you know; leave the rest.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What a person cannot do, or does with too much effort, today.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who
      description: The kind of traveller or workspace this is for.
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals and non-goals
      description: What success looks like, and what this deliberately is not.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
      description: Anything already decided, and anything you want the grilling to settle.
