name: Idea
description: A new capability. Gets triaged, then a human adds `spec` for a spec PR before any code.
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        The Reconciler triages the idea: it adds the SDLC labels and writes the Agent Brief (SDLC.md).
        When it is time, a human adds `spec`: the spec lands in `.ai/specs/` on a design-only PR, and only a
        merged spec gets built. Write what you know; leave the rest.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What a person cannot do, or does with too much effort, today.
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who
      description: The kind of traveller or workspace this is for.
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals and non-goals
      description: What success looks like, and what this deliberately is not.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and open questions
      description: Anything already decided, and anything you want the grilling to settle.
