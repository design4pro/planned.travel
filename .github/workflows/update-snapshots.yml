name: Update e2e baselines

# Manual only. Regenerating baselines is how a real regression gets laundered
# into an accepted picture, so it is never something a push does on its own:
# somebody asks for it, and somebody reviews the resulting diff image by image.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: What changed in the design that makes the current baselines wrong?
        required: true
        type: string
      filter:
        description: Re-record only the frames whose title matches this (empty = the whole suite)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CI: 'true'
  VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
  VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
  VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
  VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

jobs:
  update:
    name: Re-record the Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The same image the gate runs in, for the same reason: a baseline recorded
    # anywhere else is a baseline the gate cannot match.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The container runs as a different uid than the one that owns the
      # checkout, and git refuses to operate on a tree it thinks belongs to
      # somebody else.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare the e2e environment
        uses: ./.github/actions/e2e-env
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          tiles-key: ${{ vars.E2E_TILES_KEY }}

      # A frame that fails for a reason other than a moved pixel — a dirty
      # console, an unpinned clock — still fails here, and the run stops before
      # it can write a baseline of a broken screen.
      #
      # `--global-timeout` overrides the config's ten minutes, which is a *per
      # shard* budget: the gate splits the suite across shards and this job does
      # not, so the whole suite on one worker ran out of clock with 121 frames
      # never started. Thirty-five minutes sits inside the job's forty.
      #
      # `filter` narrows it to the frames a change actually moved. A design
      # change that touches one screen has no business re-recording the other
      # hundred and seventy — and a narrow run is the one that finishes.
      - name: Re-record
        # The Playwright image's `sh` is dash, and `set -o pipefail` is a
        # bashism it exits 2 on. Both scripts here ask for bash by name.
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          if [ -n "$FILTER" ]; then
            pnpm exec playwright test --update-snapshots \
              --global-timeout=2100000 --grep "$FILTER"
          else
            pnpm exec playwright test --update-snapshots \
              --global-timeout=2100000
          fi

      - name: Open a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # Staged first, asked second. `git diff` alone reads tracked files
          # only, and a screen that never had a baseline arrives as an
          # untracked one — so the first run for a new screen wrote four PNGs
          # and then reported "no change" over the top of them.
          git add -A e2e/__screenshots__
          if git diff --cached --quiet -- e2e/__screenshots__; then
            echo '::notice title=No change::the re-recorded frames are identical to the committed ones'
            exit 0
          fi

          branch="claude/e2e-baselines-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Carries the staged frames onto the new branch.
          git checkout -b "$branch"
          # `--no-verify`: the pre-commit hook runs the whole unit suite, which
          # this container has no business being judged by — it re-records
          # pictures and touches no source. It also carries failures that are
          # already red on `develop`, so the hook fails every run of this job
          # and threw away a successful re-record before it could be committed.
          git commit --no-verify -m "test(e2e): re-record Linux baselines

          $REASON"
          git push origin "$branch"
          # Based on the ref this ran from, not on develop: frames recorded from a
          # feature branch describe that branch's screens, and merging them into
          # develop ahead of the code would leave the gate red on both sides.
          gh pr create \
            --title 'test(e2e): re-record Linux baselines' \
            --body "Recorded by \`update-snapshots\` run ${GITHUB_RUN_ID}.

          **Reason given:** ${REASON}

          Review every changed image: an accepted baseline is an accepted design." \
            --base "$GITHUB_REF_NAME" --head "$branch"
