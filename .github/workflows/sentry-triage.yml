name: Sentry triage

# Weekly sweep of Sentry for recurring, high-impact errors, filing the ones that clear the
# threshold as `bug` + `priority-high` + `groom`. The `groom` label starts the cezar groom run
# (the `issue.opened` automation is gated on maintainer authors, and this job files as the Actions
# bot), which adds the remaining SDLC labels and implementation notes (ADR 0018); a human decides
# whether to add `autofix`. This workflow never applies `autofix` itself.
#
# It runs the SAME script as `pnpm sentry-triage`, on the runner: the thresholds, the dedup index
# and the issue body live in scripts/sentry-triage/policy.ts, so the local run and this one cannot
# drift. One sweep a week, at most three issues, and a report artifact either way.
on:
  schedule:
    # Tuesdays 06:00 UTC — after Monday's deploys have soaked for a day, and early enough that the
    # tickets are waiting when somebody plans the week.
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      file_issues:
        description: 'File the qualifying candidates (unchecked = report only)'
        type: boolean
        default: false
      window:
        description: 'Look-back window'
        type: choice
        options: ['24h', '7d', '14d', '30d']
        default: '7d'
      max_issues:
        description: 'Cap on issues filed in this run'
        type: string
        default: '3'

concurrency:
  group: sentry-triage
  cancel-in-progress: false

# `runs-on` below reads through `vars.RUNNER_AGENT`, an organisation variable that is
# deliberately unset: unset, the default here selects a GitHub-hosted runner, which is
# discarded after the job by the platform - the disposability this job needs, since
# `claude.ai/install.sh` writes into `$HOME` on every run. Setting it to
# `["self-hosted","linux","ARM64","agent"]` moves it onto the ephemeral agent pool,
# which provides the same property by configuration. ADR 0026 supersedes ADR 0023.
#
# The ephemeral pool is also what keeps the `claude.ai/install.sh` step below honest:
# it installs into `$HOME/.local/bin` on every run, and on a runner that outlived its
# job those installs would accumulate. Here there is no such runner.

jobs:
  sweep:
    # A fork inherits the cron, has none of the secrets, and would mail its owner a red run every
    # week forever. Pin it to this repository.
    if: github.repository == 'design4pro/planned.travel'
    runs-on: ${{ fromJSON(vars.RUNNER_AGENT || '["ubuntu-latest"]') }}
    timeout-minutes: 30

    permissions:
      contents: read
      issues: write

    steps:
      - name: Check the Sentry credentials are configured
        id: gate
        env:
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_ACCESS_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG || vars.SENTRY_ORG }}
        run: |
          if [ -z "$SENTRY_ACCESS_TOKEN" ] || [ -z "$SENTRY_ORG_SLUG" ]; then
            echo "::warning::SENTRY_ACCESS_TOKEN or SENTRY_ORG_SLUG is unset - skipping the sweep."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - name: Set up the toolchain
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup

      - name: Install the Claude Code CLI
        if: steps.gate.outputs.configured == 'true'
        # The installer drops the binary in ~/.local/bin, which is not on the runner's PATH; it goes
        # on through $GITHUB_PATH, which appends for every later step.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sweep Sentry
        if: steps.gate.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github.token is enough now: the consumer of a filed issue is cezar's poller, which reads
          # the issue API, not a workflow trigger (GitHub emits no workflow-triggering events for
          # actions taken with GITHUB_TOKEN, which is why this used to be a PAT).
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_ACCESS_TOKEN }}
          # One organization and one project, so `SENTRY_ORG` / `SENTRY_PROJECT` - already set for
          # the source-map upload in deploy.yml - are the single source of truth. The `_SLUG` names
          # survive on the right-hand side because they are what the environment must be called:
          # scripts/sentry-triage/mcp.json interpolates `${SENTRY_ORG_SLUG}` by that exact name.
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG || vars.SENTRY_ORG }}
          SENTRY_PROJECT_SLUGS: ${{ vars.SENTRY_PROJECT_SLUGS || vars.SENTRY_PROJECT }}
        run: |
          pnpm sentry-triage \
            --window "${{ inputs.window || '7d' }}" \
            --max "${{ inputs.max_issues || '3' }}" \
            ${{ (github.event_name == 'schedule' || inputs.file_issues) && '--file-issues' || '' }}

      # Kept even on a red run: a report that names why nothing qualified is the useful artifact.
      - name: Keep the report
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sentry-triage-report
          path: .agent/sentry-triage-*.json
          if-no-files-found: warn
