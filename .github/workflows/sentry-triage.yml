name: Sentry triage

# Weekly sweep of Sentry for recurring, high-impact errors, filing the ones that clear the
# threshold as `type: bug` + `status: pending`. Those two labels are the whole point: triage.yml
# fires on `opened` for exactly that pair, reproduces the claim at HEAD and promotes it, or not,
# per ADR 0006. This workflow never applies `ready-for-agent` itself.
#
# It runs the SAME orchestrator as `pnpm sandcastle:sentry`, on noSandbox() rather than docker() -
# the runner is already disposable. The thresholds, the dedup index and the issue body live in
# .sandcastle/sentry-triage/policy.ts, so the local run and this one cannot drift. That is also why
# this is not `anthropics/claude-code-action@v1` like triage.yml: that workflow's prompt IS its
# routine, and this one's is not.
#
# The first `schedule:` trigger in this repository. ADR 0004 deliberately deferred running
# sandcastle in CI, so this stays narrow: one sweep a week, at most three issues, and a report
# artifact either way.
on:
  schedule:
    # Tuesdays 06:00 UTC — after Monday's deploys have soaked for a day, and early enough that the
    # tickets are waiting when somebody plans the week.
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      file_issues:
        description: 'File the qualifying candidates (unchecked = report only)'
        type: boolean
        default: false
      window:
        description: 'Look-back window'
        type: choice
        options: ['24h', '7d', '14d', '30d']
        default: '7d'
      max_issues:
        description: 'Cap on issues filed in this run'
        type: string
        default: '3'

concurrency:
  group: sentry-triage
  cancel-in-progress: false

jobs:
  sweep:
    # A fork inherits the cron, has none of the secrets, and would mail its owner a red run every
    # week forever. Pin it to this repository.
    if: github.repository == 'design4pro/planned.travel'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Retained so a debugging run can fall back to github.token, though it must not file with it
      # — see GH_TOKEN below.
      issues: write

    steps:
      - name: Check the Sentry credentials are configured
        id: gate
        env:
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_ACCESS_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
        run: |
          if [ -z "$SENTRY_ACCESS_TOKEN" ] || [ -z "$SENTRY_ORG_SLUG" ]; then
            echo "::warning::SENTRY_ACCESS_TOKEN or SENTRY_ORG_SLUG is unset - skipping the sweep."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the Claude Code CLI
        if: steps.gate.outputs.configured == 'true'
        run: curl -fsSL https://claude.ai/install.sh | bash

      # sandcastle's env resolver forwards only the keys that APPEAR in .sandcastle/.env, taking
      # `sandcastleEnv[key] || process.env[key]`. Empty values here name the keys; the real values
      # arrive through the step env below and never touch the filesystem.
      - name: Name the env keys for the sandcastle resolver
        if: steps.gate.outputs.configured == 'true'
        run: |
          printf '%s\n' \
            'CLAUDE_CODE_OAUTH_TOKEN=' \
            'GH_TOKEN=' \
            'SENTRY_ACCESS_TOKEN=' \
            'SENTRY_ORG_SLUG=' \
            'SENTRY_PROJECT_SLUGS=' > .sandcastle/.env

      - name: Sweep Sentry
        if: steps.gate.outputs.configured == 'true'
        env:
          PATH: /home/runner/.local/bin:${{ env.PATH }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A PAT, not github.token, and this is load-bearing rather than fussy: GitHub does not
          # emit workflow-triggering events for actions taken with GITHUB_TOKEN, so issues filed
          # with it would never start triage.yml. They would land in the backlog and sit there,
          # silently, which defeats the entire point of this workflow.
          GH_TOKEN: ${{ secrets.SANDCASTLE_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_ACCESS_TOKEN }}
          SENTRY_ORG_SLUG: ${{ vars.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT_SLUGS: ${{ vars.SENTRY_PROJECT_SLUGS }}
        run: |
          pnpm sandcastle:sentry --ci \
            --window "${{ inputs.window || '7d' }}" \
            --max "${{ inputs.max_issues || '3' }}" \
            ${{ (github.event_name == 'schedule' || inputs.file_issues) && '--file-issues' || '' }}

      # Kept even on a red run: a report that names why nothing qualified is the useful artifact.
      - name: Keep the report
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sentry-triage-report
          path: .sandcastle/logs/sentry-triage-*.md
          if-no-files-found: warn
