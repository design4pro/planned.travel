name: Claude

# Interactive mode: no `prompt` input, so Claude waits to be addressed rather
# than running on its own. Mention @claude in an issue, in a comment on one, or
# in a pull request review and it picks the work up from there, pushes to a
# `claude/`-prefixed branch and opens a pull request against it.
#
# This runs on a GitHub-hosted runner, not on the Anthropic cloud VM that
# `claude --cloud` uses. The practical difference is that everything the job
# needs has to be installed here, and that CI on the resulting branch is the
# same CI as for any other branch. See docs/CLOUD.md §3.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One conversation at a time per issue or pull request: two runs answering the
# same thread would push over each other's commits.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Keeps a runner from starting on the overwhelming majority of comments,
    # which are people talking to each other. The action checks the trigger
    # phrase again itself before it answers.
    if: >
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required by the action's default GitHub App authentication.
      id-token: write
      # Lets Claude read the CI results on a pull request it is asked about.
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Claude runs `pnpm lint`, `pnpm typecheck` and `pnpm test` itself while it
      # works. Installing here rather than leaving it to figure out the package
      # manager saves it a couple of turns on every single run.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Git Flow: agent branches are cut from develop and their pull
          # requests target develop; promotion to main is a separate PR.
          base_branch: develop
          claude_args: |
            --max-turns 40
