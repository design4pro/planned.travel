name: Auto-merge develop

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-develop
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Scheduled workflows run from the default branch. No pull-request content is executed.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create a non-bypass merge token
        id: app
        if: vars.AUTO_MERGE_DEVELOP_APPLY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
          permission-checks: read

      - name: Inspect and merge at most one eligible pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AUTO_MERGE_REVIEWERS: ${{ vars.AUTO_MERGE_REVIEWERS }}
          AUTO_MERGE_QA_REVIEWERS: ${{ vars.AUTO_MERGE_QA_REVIEWERS }}
          APPLY: ${{ vars.AUTO_MERGE_DEVELOP_APPLY }}
        run: |
          if [ "$APPLY" = true ]; then
            node scripts/agents/auto-merge-develop.mjs --apply
          else
            node scripts/agents/auto-merge-develop.mjs --dry-run
          fi
