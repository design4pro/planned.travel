name: Deploy

# Git Flow's release leg: a push to `main` - the merged promotion pull request -
# deploys production once CI has passed on that commit. ci.yml calls this
# workflow as its last job, behind `verify`, the unit suite and the e2e report,
# so a red commit never reaches production (ADR 0021). `workflow_dispatch` waits on
# nothing: it is for redeploying a commit by hand, or for shipping while CI
# itself is down.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# `runs-on` below reads through `vars.RUNNER_DEPLOY`, a repository variable that is
# deliberately unset: unset, the default here selects the VPS pool's `ci` slots, like
# every other job in this repository (ADR 0027). ADR 0026's objection to deploying from
# the pool was a pnpm store, a Node toolcache and a restarted container shared with
# pull request code; the VPS pool shares none of them - one job per container, the
# container discarded afterwards, and its only mount is the artifact store, which a
# deploy never reads. When the VPS is down, setting the variable to
# `["ubuntu-latest"]` ships from a GitHub-hosted runner without a pull request.

jobs:
  deploy:
    name: Migrate and deploy to production
    runs-on: ${{ fromJSON(vars.RUNNER_DEPLOY || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 25
    # Never run two deploys at once, and never cancel one half-way: an interrupted
    # `d1 migrations apply` would leave the schema between two versions. On the
    # job, so it holds the same way whether ci.yml calls this or a human dispatches it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://planned.travel

    env:
      CI: 'true'
      # Public Polar product ids, inlined into both bundles at build time. Same
      # four repository *variables* CI reads, in the same order — production ids
      # here, sandbox ids in a developer's .env.local.
      VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
      VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
      VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
      VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

      # Sentry. The DSN is public by construction - it ships in the client bundle - so it is a
      # repository variable, while the token that uploads source maps is a secret. VITE_ENVIRONMENT
      # mirrors the ENVIRONMENT var the Worker reads from wrangler.jsonc, because the browser cannot
      # read a Worker var. VITE_SENTRY_RELEASE is read by BOTH bundles, so one deploy is one Sentry
      # release rather than two halves nothing relates.
      #
      # All of these may be empty. Without SENTRY_AUTH_TOKEN the build generates no source maps and
      # uploads nothing; without the DSN the SDK is tree-shaken out of the bundle entirely. A fork
      # therefore builds and deploys exactly as before.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_ENVIRONMENT: production
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate
      # is a first step: a fork or a freshly cloned repo without Cloudflare
      # credentials reports a warning and skips, instead of failing red.
      - name: Check deploy credentials are configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up the toolchain
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/setup

      - name: Generate route tree
        if: steps.gate.outputs.configured == 'true'
        run: pnpm generate-routes

      - name: Build
        if: steps.gate.outputs.configured == 'true'
        run: pnpm build

      # Migrations run first and are additive by policy (see docs/DEPLOY.md), so
      # the currently deployed Worker keeps serving against the new schema while
      # the upload completes.
      - name: Apply D1 migrations
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # No `wranglerVersion` on purpose, here or in any other call below.
          # Unset, wrangler-action runs whatever `pnpm exec wrangler --version`
          # reports, so pnpm-lock.yaml owns the version. What the old pin did
          # and why it is not coming back is written down once, next to the test
          # that holds it open: scripts/__tests__/wrangler-version-ownership.test.mjs (#567).
          command: d1 migrations apply planned-travel-db --remote

      # The `airports` table is the one the migration above creates and does not
      # fill: it is platform reference data cut from a public-domain source at
      # build time, so the rows live in a committed artefact rather than in the
      # schema. The connection search's stop picker is a gate rather than a
      # shortcut — a timetable router is asked *where*, and free text carries no
      # coordinates — so an unloaded table is that feature not working at all.
      #
      # Runs on every deploy rather than only when the artefact changed, because
      # the load is an upsert followed by a sweep on its own load stamp: the
      # table is never empty for a reader, and a deploy carrying an unchanged
      # artefact rewrites nine thousand rows to the values they already hold,
      # which costs seconds and changes nothing anyone can observe. The SQL is
      # generated first so the execute below is the same wrangler-action, using
      # the same wrangler as every other call here.
      - name: Load the airport catalogue
        if: steps.gate.outputs.configured == 'true'
        run: node scripts/seed/airports.mjs --sql-out airports.sql

      - name: Apply the airport catalogue
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 execute planned-travel-db --remote --file airports.sql --yes

      - name: Deploy Worker
        if: steps.gate.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      # Cheap proof that the new version is actually serving: the tile endpoint
      # exercises the Worker, the R2 binding and the Range path in one request.
      # The hostname sits behind Cloudflare Access, so the requests carry an
      # Access service token and assert exact status codes — a bare `curl
      # --fail` would treat the Access 302 login redirect as green.
      - name: Smoke-check the deployment
        if: steps.gate.outputs.configured == 'true'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          auth=(--header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          code=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${auth[@]}" https://planned.travel/)
          echo "landing: $code"; test "$code" = 200
          code=$(curl --silent --show-error --output /dev/null \
            --header 'Range: bytes=0-15' --write-out '%{http_code}' "${auth[@]}" \
            https://planned.travel/api/tiles/basemap.pmtiles)
          echo "tiles: $code"; test "$code" = 206
