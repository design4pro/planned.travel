name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  git-flow-policy:
    name: Git Flow policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate branch routing and ancestry
        env:
          GIT_FLOW_HEAD_REF: ${{ github.head_ref }}
          GIT_FLOW_BASE_REF: ${{ github.base_ref }}
          GIT_FLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_FLOW_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GIT_FLOW_BASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-git-flow-policy.mjs

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release contract
        run: pnpm release:check

      - name: Apply migrations to a fresh local D1
        run: pnpm db:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build web and mobile artifacts
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/web/dist
            apps/mobile/dist

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

  chromium:
    name: Chromium staging E2E
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @planned/web exec playwright install --with-deps chromium

      - name: Run staging Chromium checks
        run: pnpm --filter @planned/web e2e:staging
        env:
          E2E_BASE_URL: https://planned-travel-web-staging.design4pro.workers.dev

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: apps/web/test-results
