name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch: a force-push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  # Polar product ids are public and are inlined into both bundles by Vite, so
  # the build needs them to produce the same output CI is meant to verify.
  # They live in repository *variables*, never in secrets. Leave one unset and
  # the build still goes green — `requirePrice()` in src/lib/plans.ts throws for
  # that plan and interval alone, at the moment a customer clicks Upgrade.
  VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
  VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
  VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
  VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

jobs:
  verify:
    name: lint · typecheck · build
    # A develop→main (or main→develop) PR duplicates the push-triggered run on
    # the same commits; the push run is canonical for the shared branches. The
    # `e2e` job carries the same clause in its own `if`, since it does not wait
    # on this one.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The agent layer this branch carries is what a cezar run executes: pr-autopilot
      # and pr-fix check out the PR *head*, so a branch cut before a pipeline change
      # runs the old hooks, the old workflows and the old guards, and nothing else
      # notices. First, before the toolchain, because it needs only the runner's node
      # and a branch in that state should go red in seconds rather than after a build.
      - name: Check the agent layer
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            # A push or a manual run has no base to be behind; hashes only.
            node .ai/scripts/agent-kit-check.mjs
            exit 0
          fi
          # Explicit refspecs: the checkout is shallow and its configured one covers
          # only the ref it fetched. Depth 1 is enough on both sides - all this reads
          # is each tip's copy of the lock. The head is fetched separately because
          # this job holds refs/pull/N/merge, and a merge already carries the base's
          # lock whenever the head never touched it; judging the worktree would pass
          # every stale branch, which is the shape this gate exists to catch.
          git fetch --depth=1 origin \
            "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            "+$HEAD_SHA:refs/remotes/origin/pr-head"
          node .ai/scripts/agent-kit-check.mjs --base "origin/$BASE" --head origin/pr-head

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # `src/routeTree.gen.ts` is generated and committed. Regenerating it here
      # proves the committed copy matches the route files in the same commit —
      # a stale tree is otherwise only discovered as a mystery type error.
      - name: Generate route tree
        run: pnpm generate-routes

      - name: Check the committed route tree is current
        run: |
          set -euo pipefail
          # --intent-to-add first: `git diff` is blind to a file git has never
          # seen, so without this a *new* generated file - a first route in a
          # new directory - reports clean and the drift ships.
          git add --intent-to-add -- src/routeTree.gen.ts
          git diff --exit-code -- src/routeTree.gen.ts

      # `drizzle/` is generated and committed the same way the route tree is, and
      # a schema edit with no committed migration is caught here rather than in
      # production, where it presents as a query against a column that does not
      # exist.
      #
      # `< /dev/null` because drizzle-kit asks, on a rename it cannot infer,
      # whether a column was created or renamed. On a runner there is nobody to
      # answer, and a prompt with no stdin hangs until the job timeout instead of
      # failing. Closed stdin turns that into an immediate, readable error.
      - name: Generate migrations from the schema
        run: pnpm db:generate < /dev/null

      - name: Check every schema change has a committed migration
        run: |
          set -euo pipefail
          git add --intent-to-add -- drizzle/
          if ! git diff --exit-code -- drizzle/; then
            echo "::error title=Uncommitted migration::The schema and drizzle/ disagree. Run 'pnpm db:generate' and commit the result - migrations are additive, and the running Worker has to survive the migrate-then-deploy window."
            exit 1
          fi

      # `.ai/specs/README.md` is generated from the metadata table in each spec,
      # and those tables are what say whether a designed change shipped, is
      # waiting, or was dropped. The table is checked against the directory
      # holding the file by scripts/specs/__tests__/spec-registry.test.ts; this
      # step catches only the other half - an index nobody regenerated after
      # moving a spec or appending a pull request to one.
      - name: Generate the spec index
        run: pnpm generate-spec-index

      - name: Check the committed spec index is current
        run: |
          set -euo pipefail
          git add --intent-to-add -- .ai/specs/README.md
          if ! git diff --exit-code -- .ai/specs/README.md; then
            echo "::error title=Stale spec index::.ai/specs/README.md no longer matches .ai/specs/. Run 'pnpm generate-spec-index' and commit the result."
            exit 1
          fi

      # ESLint spends its time building a typed program and then walking it, and
      # on a pull request almost none of that work is new. `--cache` skips a file
      # whose bytes have not changed since the last run: measured on this repo,
      # 10.7 s cold against 0.6 s with nothing to redo.
      #
      # Pull requests only, and that restriction is the point. The typed rules
      # mean a change to one file can change another file's verdict, and the
      # cache cannot know that - it keys on each file's own content, so a lint
      # can come back green over an error it simply did not look at. The
      # uncached run on a push to `develop` or `main` is the canonical one, and
      # it is the one that guards the shared branch.
      - name: Restore the ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: .eslintcache
          # `github.sha` never hits, so every run saves a fresh entry and the
          # `restore-keys` prefix picks up the most recent one. Changing the
          # config, the tsconfig or a dependency starts a new lineage, because a
          # cache from before any of those describes a different lint.
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      # `--cache-strategy content` and not the default. ESLint decides a file is
      # unchanged by size and mtime unless told otherwise, and a fresh checkout
      # stamps every file with a new mtime - so the default strategy restored a
      # perfectly good cache and then ignored all of it. Measured after touching
      # every source file: 10.5 s on metadata, 0.7 s on content.
      - name: Lint
        run: >-
          pnpm lint ${{ github.event_name == 'pull_request'
          && '--cache --cache-strategy content' || '' }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The TanStack Start vite plugin generates the same file `tsr generate`
      # does, and appends the Start `Register` footer to it. `tsr.config.json`
      # carries that footer verbatim, as one `routeTreeFileFooter` entry with
      # embedded newlines — the generator puts a blank line between entries, so
      # splitting the footer across them would emit blank lines the plugin does
      # not. That is what keeps the two byte-identical. Should they ever drift
      # again — a Start upgrade that changes the footer, a `src/router.tsx`
      # rename, a generator version bump — the build dirties the committed tree
      # and this step says so, instead of every later build and dev server
      # silently doing it. See issue #82.
      - name: Check the build left the route tree alone
        run: git diff --exit-code -- src/routeTree.gen.ts

  # The unit suite, sharded the way the journeys are, and for the same reason:
  # the runner has two vCPUs, vitest already fills both, and the suite is
  # CPU-bound - so the only way left to make it finish sooner is to give it more
  # machines. As one job it was 361 s, 74% of a 486 s pipeline.
  #
  # Three rather than more. Vitest cuts shards by file, and the files are not
  # equal: measured, three shards carry 27% / 34% / 39% of the work and four
  # carry 24% / 19% / 32% / 25%, so a fourth shard takes about 26 s off the wall
  # clock and adds a whole job's fixed cost to the bill. Three is where that
  # trade stops being worth it.
  #
  # Each shard writes a blob report instead of its own verdict, because a shard
  # only ever sees a third of the picture: per-glob coverage thresholds are
  # meaningless on a third of the files, and three separate "50 passed" lines
  # are not a result anybody can read. `test-report` below merges them.
  test:
    name: unit tests (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # `--coverage` on every shard because v8 has to instrument the run that
      # executes the code; the merge step cannot invent coverage for files a
      # shard never loaded. The blob carries it, and the numbers add up exactly
      # - verified against an unsharded run, 10280/19069 statements either way.
      - name: Run this shard of the suite
        # `VITEST_SHARDED` turns off the per-glob coverage thresholds for this
        # run; `test-report` applies them to the merged whole. A shard executes
        # a third of the files, so what it measures for any one glob is a third
        # of the truth - the first sharded run failed exactly this way, every
        # shard red on a tiles threshold that the merged coverage meets, and no
        # blob written because the process was already exiting.
        env:
          VITEST_SHARDED: '1'
        run: >-
          pnpm exec vitest run --coverage
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=blob
          --outputFile=unit-blob-reports/blob-${{ matrix.shard }}.json

      # `always()`: a shard that fails still has a report, and that report is
      # the only place its failures are legible.
      #
      # The directory is not vitest's own `.vitest-reports`, and the dot is the
      # whole reason: `upload-artifact` treats a dot-prefixed path as hidden and
      # silently uploads nothing, which it did - the blob was written, the log
      # said so, and the artifact was empty. `e2e` above writes to `blob-report`
      # for the same reason.
      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ matrix.shard }}
          path: unit-blob-reports
          retention-days: 1
          if-no-files-found: error

  # One verdict for the three shards, and the only place the coverage thresholds
  # can be judged: they are per-glob, and no single shard holds a whole glob.
  test-report:
    name: unit tests · merged report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Download the blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: all-blob-reports
          merge-multiple: true

      # Counted, not assumed. A shard that dies before writing its blob - an OOM,
      # a runner evicted - would otherwise merge into a green report over a third
      # of the suite nobody ran, which is worse than a red one.
      - name: Check every shard reported
        shell: bash
        run: |
          set -euo pipefail
          found=$(find all-blob-reports -name '*.json' -type f | wc -l | tr -d ' ')
          if [ "$found" -ne 3 ]; then
            echo "::error title=Missing shard report::expected 3 blob reports, found $found - a shard produced none, so this run has not tested the whole suite."
            exit 1
          fi

      # Merging replays the recorded results rather than re-running anything, so
      # this is seconds. The exit code is the suite's, and the coverage
      # thresholds are applied here - verified by raising one and watching the
      # merge go red.
      - name: Merge the shard reports
        run: pnpm exec vitest --mergeReports=all-blob-reports --coverage --reporter=default --reporter=github-actions

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  # The end-to-end journeys: fourteen declarations in `journeys.spec.ts`, three
  # in `trips-core.spec.ts` and two browser-free HTTP claims in `csrf.spec.ts`,
  # over two browser projects. Not a visual gate
  # any more - no screenshot is compared anywhere (ADR 0016). What a run asserts
  # is that every screen answers, renders, hydrates, says nothing in the console,
  # and lets a reader act on it.
  #
  # Two shards on the standard 2-vCPU runner, one Playwright worker each (two
  # starved the map tests into timeouts - see `workers` in playwright.config),
  # started alongside `verify` rather than behind it: every job pays ~2 min of
  # fixed cost (image pull, install, migrations, seed) that no worker count
  # shortens, and a `needs: verify` in front of it (5-7 min of vitest coverage)
  # would double the wall clock. Twelve shards were sized for eighty-seven test
  # instances a project; nineteen declarations do not divide usefully past two -
  # four shards would halve the test time and pay the fixed cost twice more, for
  # about the same total.
  # Each shard is its own container with its own D1, so shards never share
  # state; `e2e-report` below merges the blob reports into one HTML.
  # The price of not waiting on `verify` is a wasted run when a typecheck fails,
  # which is rare and cheap next to what this used to take.
  #
  # Back on every PR. It was demoted to a post-merge net when it cost ~60 min of
  # runner per event; measured, it now costs ~22 (two shards of ~11). That is a
  # ~63% cut per event and, spread over ~6 PR events a merge, roughly twice the
  # aggregate the post-merge net cost - the feedback loop is bought, not free.
  # ADR 0016's cost table carries the arithmetic. The `needs-e2e` escape hatch
  # that the demotion needed goes with it. No R2
  # credentials are read any more either (the journeys need no basemap - see the
  # `basemap` input of the composite action), so the job runs on a fork.
  # A develop→main PR still defers to the push run, as `verify` does.
  e2e:
    name: e2e · critical journeys (${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    # Measured on the 2-vCPU runner, first green run (33806080237): 2-3 min of
    # fixed cost - image pull, checkout, install, migrations, seed - then 6m41s of
    # journeys on shard 1 and 9m59s on shard 2, for jobs of 9m44s and 11m58s. At
    # `timeout-minutes: 10` both shards were killed: shard 1 a few seconds after
    # its last test passed, shard 2 mid-suite. A job timeout that fires before the
    # config's own `globalTimeout` inverts the design - the point of the config
    # firing first is that a slow shard still uploads a report instead of
    # vanishing - so this is 20 and `globalTimeout` is 15. The estimate that
    # produced 10 was taken at two local workers on a 16-core machine and did not
    # survive contact.
    #
    # The two shards are uneven, 6m41s against 9m59s, because `--shard` splits by
    # test count and these tests are not the same size. Worth rebalancing only if
    # shard 2 starts approaching 15 min; the fix would be `--shard` by duration,
    # which Playwright does not offer, or moving one journey by hand, which drifts.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Keep in step with the `@playwright/test` devDependency in package.json:
    # the image carries the browsers that version expects, and a mismatch is
    # reported as a missing executable rather than as a wrong one.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare the e2e environment
        uses: ./.github/actions/e2e-env
        with:
          # Both shards seed identical databases; auditing the seed once is
          # proof enough, and 25 s off the other shard's critical path.
          verify-seed: ${{ matrix.shard == 1 }}

      # `PLAYWRIGHT_BASE_URL` points the suite at the server the composite
      # action already started and seeded, so the config starts none of its own.
      # `--shard` splits per test (fullyParallel), and `--reporter=blob` replaces
      # the config's reporters with the one `merge-reports` consumes — traces
      # and screenshots of failures travel inside the blob.
      - name: Run this shard of the suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          if-no-files-found: ignore

  # One report for the two shards: the GitHub annotations and the HTML report
  # (with the failing journeys' traces and videos) that a single job would give.
  e2e-report:
    name: e2e · merged report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Download the blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # No blobs means the shards did not run — on a develop→main PR, which
      # defers to the push run. A notice, not a failure.
      - name: Merge the shard reports
        run: |
          set -euo pipefail
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo '::notice title=e2e report::no shard reports to merge — the journeys did not run.'
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
