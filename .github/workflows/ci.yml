name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch. On a pull request a push supersedes the run it
# interrupted. A push to `develop` or `main` is never cancelled, because that
# run ends by deploying (`deploy-staging` / `deploy-production` below) and an
# interrupted `d1 migrations apply` would leave the schema between two
# versions. Those runs queue instead: GitHub keeps one pending run per group and
# replaces it with the newest, so a burst of merges costs two runs, not one each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  # Polar product ids are public and are inlined into both bundles by Vite, so
  # the build needs them to produce the same output CI is meant to verify.
  # They live in repository *variables*, never in secrets. Leave one unset and
  # the build still goes green — `requirePrice()` in src/lib/plans.ts throws for
  # that plan and interval alone, at the moment a customer clicks Upgrade.
  VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
  VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
  VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
  VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

# `runs-on` in every job below reads through `vars.RUNNER_CI`, a repository
# variable that is deliberately unset: unset, each job's own default selects the
# `ci` slots of the VPS pool - two ephemeral x64 containers of 4 CPU / 8 GB on KVM
# Haswell vCPUs, about three times slower per core than the machines most numbers
# below were measured on. Setting it to `["ubuntu-latest"]` moves every job in this
# repository to GitHub-hosted runners without a pull request, which is the recovery
# path that does not need the host to be up. ADR 0027.

jobs:
  verify:
    name: lint · typecheck · build
    # A develop→main (or main→develop) PR duplicates the push-triggered run on
    # the same commits; the push run is canonical for the shared branches. The
    # `e2e` job carries the same clause in its own `if`, since it does not wait
    # on this one.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # The local and CI gates share one implementation of generator drift checks.
      - name: Check generated files
        run: bash .ai/scripts/check-generated.sh

      # ESLint spends its time building a typed program and then walking it, and
      # on a pull request almost none of that work is new. `--cache` skips a file
      # whose bytes have not changed since the last run: measured on this repo,
      # 10.7 s cold against 0.6 s with nothing to redo.
      #
      # Pull requests only, and that restriction is the point. The typed rules
      # mean a change to one file can change another file's verdict, and the
      # cache cannot know that - it keys on each file's own content, so a lint
      # can come back green over an error it simply did not look at. The
      # uncached run on a push to `develop` or `main` is the canonical one, and
      # it is the one that guards the shared branch.
      - name: Restore the ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: .eslintcache
          # `github.sha` never hits, so every run saves a fresh entry and the
          # `restore-keys` prefix picks up the most recent one. Changing the
          # config, the tsconfig or a dependency starts a new lineage, because a
          # cache from before any of those describes a different lint.
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'pnpm-lock.yaml') }}-

      # `--cache-strategy content` and not the default. ESLint decides a file is
      # unchanged by size and mtime unless told otherwise, and a fresh checkout
      # stamps every file with a new mtime - so the default strategy restored a
      # perfectly good cache and then ignored all of it. Measured after touching
      # every source file: 10.5 s on metadata, 0.7 s on content.
      - name: Lint
        run: >-
          pnpm lint ${{ github.event_name == 'pull_request'
          && '--cache --cache-strategy content' || '' }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The TanStack Start vite plugin generates the same file `tsr generate`
      # does, and appends the Start `Register` footer to it. `tsr.config.json`
      # carries that footer verbatim, as one `routeTreeFileFooter` entry with
      # embedded newlines — the generator puts a blank line between entries, so
      # splitting the footer across them would emit blank lines the plugin does
      # not. That is what keeps the two byte-identical. Should they ever drift
      # again — a Start upgrade that changes the footer, a `src/router.tsx`
      # rename, a generator version bump — the build dirties the committed tree
      # and this step says so, instead of every later build and dev server
      # silently doing it. See issue #82.
      - name: Check the build left the route tree alone
        run: git diff --exit-code -- src/routeTree.gen.ts

  # The unit suite, as one job. It was three shards and a merge job while the
  # runner was a 2-vCPU GitHub-hosted machine, where one job took 361 s. In the
  # self-hosted pool's 3-CPU containers the whole suite with coverage measured
  # 139 s (one shard alone 43 s, as in CI), so the shards bought about 45 s of
  # wall clock for three more jobs of fixed cost on a pool of three slots, which
  # queued longer than that (ADR 0021). On the VPS pool's 4-CPU slots it is 532 s
  # (run 35968476152) - still one job, since the pool has two slots, not more. One run also puts the per-glob coverage
  # thresholds over the whole suite directly, with no blob reports to count and
  # merge. Moved back to GitHub-hosted runners (`vars.RUNNER_CI`, the recovery
  # path) it takes minutes again, which that path can afford.
  test:
    name: unit tests
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # The exit code is the suite's, coverage thresholds included.
      - name: Run the suite
        run: pnpm exec vitest run --coverage --reporter=default --reporter=github-actions

  # Which parts of the pipeline this pull request's diff can reach. Only `e2e`
  # reads the answer: a diff that stops at documentation - a spec, an ADR, a
  # skill - cannot change what a browser sees, and two shards of it cost ~20 min
  # of the shared self-hosted pool. `verify` and the unit suite neither wait on
  # this nor read it, because they are what guards the documentation itself.
  # The judgement and its reasons live in scripts/ci/change-scope.mjs.
  #
  # Pull requests only. A push to `develop` or `main` is the canonical run and
  # always carries the journeys; `e2e` reads this job being skipped as "run".
  scope:
    name: change scope
    if: github.event_name == 'pull_request' && !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}

    steps:
      # The merge commit and both of its parents. `HEAD^1` is the base tip the
      # merge was computed against, so the diff below is exactly what merging
      # this pull request would change - not what the branch changed since it
      # was cut, which would also count every base commit it has not merged.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The runner's own node, before any toolchain, as `verify` runs the
      # agent-layer check: the script imports nothing outside node itself.
      # `--no-renames`: rename detection is on by default and lists only the
      # destination of a move, so `git mv src/x.ts docs/x.md` would read as
      # documentation alone.
      - name: Classify the diff
        id: classify
        run: |
          set -euo pipefail
          git diff --no-renames --name-only HEAD^1 HEAD > changed-files.txt
          node scripts/ci/change-scope.mjs < changed-files.txt >> "$GITHUB_OUTPUT"

  # The end-to-end journeys: fourteen declarations in `journeys.spec.ts`, three
  # in `trips-core.spec.ts` and two browser-free HTTP claims in `csrf.spec.ts`,
  # over the `chromium` project alone. `mobile-safari` is still declared and still
  # runnable by name, but `playwright.config.ts` leaves it out of a CI run that did
  # not set `E2E_WEBKIT` - it runs nightly in `e2e-webkit.yml` instead, because it
  # was the larger half of every event here and the half that ran out of wall clock
  # (issues #552, #466). Not a visual gate
  # any more - no screenshot is compared anywhere (ADR 0016). What a run asserts
  # is that every screen answers, renders, hydrates, says nothing in the console,
  # and lets a reader act on it.
  #
  # Two shards on the standard 2-vCPU runner, one Playwright worker each (two
  # starved the map tests into timeouts - see `workers` in playwright.config),
  # started alongside `verify` rather than behind it: every job pays ~2 min of
  # fixed cost (image pull, install, migrations, seed) that no worker count
  # shortens, and a `needs: verify` in front of it (5-7 min of vitest coverage)
  # would double the wall clock. Twelve shards were sized for eighty-seven test
  # instances a project; nineteen declarations do not divide usefully past two -
  # four shards would halve the test time and pay the fixed cost twice more, for
  # about the same total.
  # Each shard is its own container with its own D1, so shards never share
  # state; `e2e-report` below checks the aggregate test outcome.
  # The price of not waiting on `verify` is a wasted run when a typecheck fails,
  # which is rare and cheap next to what this used to take.
  #
  # Back on every PR. It was demoted to a post-merge net when it cost ~60 min of
  # runner per event; measured, it then cost ~22 (two shards of ~11). That is a
  # ~63% cut per event and, spread over ~6 PR events a merge, roughly twice the
  # aggregate the post-merge net cost - the feedback loop is bought, not free.
  # ADR 0016's cost table carries the arithmetic. Dropping `mobile-safari` off
  # this path (#552) halves what remains: the same ~52 chromium tests that used
  # to fill one shard whole now split across both, so each shard carries ~26 and
  # the fixed cost is the larger part of the job. The nightly `e2e-webkit.yml`
  # pays WebKit's share once a day instead of ~6 times a merge. The `needs-e2e` escape hatch
  # that the demotion needed goes with it. No R2
  # credentials are read any more either (the journeys need no basemap - see the
  # `basemap` input of the composite action), so the job runs on a fork.
  # A develop→main PR still defers to the push run, as `verify` does.
  #
  # And a PR whose diff stops at documentation skips it, on `scope`'s word. An
  # explicit 'false' is the only answer that skips: a push or a manual run
  # (where `scope` is skipped) and a `scope` job that failed all leave the
  # output empty, and the journeys run. `!cancelled()` is what lets them start
  # behind a skipped `scope` at all. Waiting on it costs one shallow checkout,
  # not a `verify`.
  e2e:
    name: e2e · critical journeys (${{ matrix.shard }}/2)
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)) && needs.scope.outputs.e2e != 'false' }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    # Measured on the 2-vCPU runner, first green run (33806080237): 2-3 min of
    # fixed cost - image pull, checkout, install, migrations, seed - then 6m41s of
    # journeys on shard 1 and 9m59s on shard 2, for jobs of 9m44s and 11m58s. At
    # `timeout-minutes: 10` both shards were killed: shard 1 a few seconds after
    # its last test passed, shard 2 mid-suite. A job timeout that fires before the
    # config's own `globalTimeout` inverts the design - the point of the config
    # firing first is that a slow shard still uploads a report instead of
    # vanishing - so this was 20 and `globalTimeout` 15. The estimate that
    # produced 10 was taken at two local workers on a 16-core machine and did not
    # survive contact. On the OVH VPS pool (2026-09-24) they moved to 35 and
    # 30: its fixed cost is ~2 min (run 35968476152), so the job still fires second.
    #
    # The two shards were uneven, 6m41s against 9m59s, because `--shard` splits by
    # test count and these tests were not the same size: with both browser projects
    # in one pool the split fell along project lines, and the WebKit shard was the
    # slow one. That is gone with `mobile-safari` (#552, #466) - both shards are now
    # chromium and carry comparable work. Measured on run 35250473957, the first
    # one without WebKit: 285 s of journeys on shard 1 and 235 s on shard 2, for
    # jobs of 6m35s and 5m08s. Against the config's 900 s `globalTimeout` that is
    # 32% and 26% of the budget spent - roughly 70% of it unspent, where shard 1
    # used to sit at 98% and shard 2 past 100%. `--shard` still splits by count,
    # not by duration, so the next thing to make them uneven will be one heavy
    # journey rather than one heavy engine; Playwright offers no duration split,
    # and moving
    # a journey by hand drifts.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # No `container:`, on any runner. `../actions/e2e-env` installs the browsers
    # itself, at the version `pnpm install` just resolved from the lockfile, so
    # the job needs nothing from the image it lands on. The pool's image is
    # still built FROM `mcr.microsoft.com/playwright` and that install is a
    # no-op there, but it is no longer a requirement: the version coupling
    # between `host/runner/Dockerfile` in design4pro/cezar and the
    # `@playwright/test` devDependency is now corrected at the start of the job
    # rather than kept in step by hand, and the same job runs green on a
    # GitHub-hosted runner when `vars.RUNNER_CI` points there (ADR 0026).

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare the e2e environment
        uses: ./.github/actions/e2e-env
        with:
          # Both shards seed identical databases; auditing the seed once is
          # proof enough, and 25 s off the other shard's critical path.
          verify-seed: ${{ matrix.shard == 1 }}

      - name: Run this shard of the suite
        id: tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,github,json

      - name: Select failure and flaky diagnostics
        id: diagnostics
        if: always()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/ci/e2e-diagnostics.mjs >> "$GITHUB_OUTPUT"

      - name: Upload failure and flaky diagnostics
        if: ${{ always() && (steps.tests.outcome != 'success' || steps.diagnostics.outputs.upload != 'false') }}
        continue-on-error: true
        uses: design4pro/.github/actions/artifact-upload@main
        with:
          name: e2e-chromium-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            test-results/results.json
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/error-context.md
            e2e-runtime.log
            dev-server.log

  # Keep the required check name; reports are diagnostics, never the verdict.
  e2e-report:
    name: e2e · merged report
    needs: [scope, e2e]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 2
    steps:
      - name: Require every expected shard to pass
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
          SKIP_ALLOWED: ${{ github.event_name == 'pull_request' && (contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref) || (needs.scope.result == 'success' && needs.scope.outputs.e2e == 'false')) }}
        run: |
          if [ "$SHARDS_RESULT" = success ]; then exit 0; fi
          if [ "$SHARDS_RESULT" = skipped ] && [ "$SKIP_ALLOWED" = true ]; then
            echo '::notice::E2E intentionally skipped for documentation or promotion.'
            exit 0
          fi
          echo "::error::Required E2E shards did not pass: $SHARDS_RESULT"
          exit 1

  # The deploys, as the last jobs of a push run and only behind a green one.
  # They used to be workflows of their own, started by the same push at the same
  # moment as this run and reading nothing from it, so a red commit shipped
  # exactly like a green one. Each `needs` must have succeeded (ADR 0021), and
  # the `if` says so itself rather than leaving it to an implicit `success()`:
  # at job level that reads every ancestor, and `e2e-report` descends from
  # `scope`, which a push skips, so every deploy was skipped with it. A later
  # merge cannot interrupt one mid-migration either, since `concurrency` above
  # cancels pull request runs only.
  deploy-staging:
    name: deploy · staging
    needs: [verify, test, e2e-report]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.test.result == 'success' && needs.e2e-report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-production:
    name: deploy · production
    needs: [verify, test, e2e-report]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.test.result == 'success' && needs.e2e-report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
