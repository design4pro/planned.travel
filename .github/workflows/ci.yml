name: CI

on:
  pull_request:
    branches: [main, develop]
    # `labeled` lets adding the `needs-e2e` label trigger the e2e job on a PR.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch: a force-push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  # Polar product ids are public and are inlined into both bundles by Vite, so
  # the build needs them to produce the same output CI is meant to verify.
  # They live in repository *variables*, never in secrets. Leave one unset and
  # the build still goes green — `requirePrice()` in src/lib/plans.ts throws for
  # that plan and interval alone, at the moment a customer clicks Upgrade.
  VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
  VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
  VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
  VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

jobs:
  verify:
    name: lint · typecheck · test · build
    # A develop→main (or main→develop) PR duplicates the push-triggered run on
    # the same commits; the push run is canonical for the shared branches. The
    # `e2e` job carries the same clause in its own `if`, since it no longer
    # waits on this one.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `src/routeTree.gen.ts` is generated and committed. Regenerating it here
      # proves the committed copy matches the route files in the same commit —
      # a stale tree is otherwise only discovered as a mystery type error.
      - name: Generate route tree
        run: pnpm generate-routes

      - name: Check the committed route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  # The visual gate. Runs on Linux inside the Playwright image, which is the
  # platform the `-linux` baselines under e2e/__screenshots__ were recorded on;
  # a macOS run compares against its own `-darwin` set. See docs/CLOUD.md §4.
  #
  # Six shards on the standard 2-vCPU runner, two Playwright workers each,
  # started alongside `verify` rather than behind it: the suite is ~1100 s of
  # CPU-bound test execution at one worker, and every job pays ~3 min of fixed
  # cost (image pull, install, migrations, basemap, seed) that no worker count
  # shortens — so a single job can never answer inside five minutes, and a
  # `needs: verify` in front of it (5-7 min of vitest coverage) cannot either.
  # Each shard is its own container with its own D1, so shards never share
  # state; `e2e-report` below merges the six blob reports into one HTML.
  # The price of not waiting on `verify` is a wasted e2e run when a typecheck
  # fails, which is rare and cheap next to the 20 minutes this used to take.
  #
  # Demoted from every-PR to a post-merge safety net: the sandcastle loop runs
  # this exact suite, in this exact container image, per issue and again in the
  # per-iteration audit — so a PR from the loop arrives already visually
  # validated. The job still runs on every push to develop/main, on demand
  # (workflow_dispatch), and on any PR carrying the `needs-e2e` label — the
  # escape hatch for PRs with no local loop behind them (cloud agents, manual
  # branches). A labelled develop→main PR still defers to the push run, as
  # `verify` does.
  e2e:
    name: e2e · visual regression (${{ matrix.shard }}/6)
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'needs-e2e') &&
       !contains(fromJSON('["develop","main"]'), github.event.pull_request.head.ref))
    runs-on: ubuntu-latest
    # ~2.5 min fixed cost + 2-4 min of tests; the config's 10 min globalTimeout
    # fires first, so a slow shard still uploads a report instead of vanishing.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Keep in step with the `@playwright/test` devDependency in package.json:
    # the image carries the browsers that version expects, and a mismatch is
    # reported as a missing executable rather than as a wrong one.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      # The `secrets` context is not available in a job-level `if`, so the gate
      # is a first step: a fork or a freshly cloned repo without Cloudflare
      # credentials reports a warning and skips, instead of failing red on a
      # basemap it was never going to be able to read.
      - name: Check the R2 credentials are configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=e2e skipped::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the E2E_TILES_KEY variable to run the visual gate.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Prepare the e2e environment
        if: steps.gate.outputs.configured == 'true'
        uses: ./.github/actions/e2e-env
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          tiles-key: ${{ vars.E2E_TILES_KEY }}

      # `PLAYWRIGHT_BASE_URL` points the suite at the server the composite
      # action already started and seeded, so the config starts none of its own.
      # `--shard` splits per test (fullyParallel), and `--reporter=blob` replaces
      # the config's reporters with the one `merge-reports` consumes — traces
      # and screenshots of failures travel inside the blob.
      - name: Run this shard of the suite
        if: steps.gate.outputs.configured == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob

      - name: Upload the blob report
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          if-no-files-found: ignore

  # One report for the six shards: the GitHub annotations and the HTML report
  # (with the failing frames' diffs and traces) that a single job used to give.
  e2e-report:
    name: e2e · merged report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # No blobs means the shards skipped on the credentials gate — a notice,
      # not a failure, for the same reason the gate itself is not one.
      - name: Merge the shard reports
        run: |
          set -euo pipefail
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo '::notice title=e2e report::no shard reports to merge — the visual gate was skipped.'
            exit 0
          fi
          pnpm exec playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
