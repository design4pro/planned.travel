name: Verify staging calendar edge enforcement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Bounded staging-only verification
    runs-on: ${{ fromJSON(vars.RUNNER_DEPLOY || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 2
    environment: staging
    steps:
      - name: Verify existing Access identity and edge threshold
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PYTHON'
          import concurrent.futures
          import json
          import os
          import re
          import subprocess
          import sys
          import threading
          import time
          import urllib.error
          import urllib.request
          
          URL = 'https://staging.planned.travel/api/feed/cez-902-enforcement-probe-invalid'
          MAX_ATTEMPTS = 140
          AUTH = {'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'],
                  'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET']}
          if not all(AUTH.values()):
              raise SystemExit('Missing existing Access identity; no requests sent')
          
          REQUEST_CODE = "import json, os, re, time, urllib.error, urllib.request\nURL = 'https://staging.planned.travel/api/feed/cez-902-enforcement-probe-invalid'\nAUTH = {'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'], 'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET'], 'User-Agent': 'Mozilla/5.0 (compatible; PlannedTravelVerification/1.0; +https://planned.travel)', 'Accept': 'text/plain'}\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, *args):\n        return None\ndef perform():\n    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())\n    try:\n        response = opener.open(urllib.request.Request(URL, headers=AUTH), timeout=5)\n    except urllib.error.HTTPError as error:\n        response = error\n    with response:\n        body = response.read(65536).decode('utf-8', 'replace')\n        ray = response.headers.get('cf-ray', '')\n        location = response.headers.get('location', '')\n        return {'status': response.code,\n                'ray': ray if re.fullmatch(r'[0-9a-fA-F]+-[A-Z]{3}', ray) else None,\n                'edge_1015': bool(re.search(r'(?:Error\\s*(?:code\\s*)?(?:</?[^>]+>\\s*)*1015|error-code[^>]*>1015)', body, re.I)),\n                'access': '.cloudflareaccess.com/' in location}\ntry:\n    print(json.dumps(perform()))\nexcept Exception:\n    print(json.dumps({'status': None, 'transport_error': True}))\n"
          
          def request(timeout):
              started = time.monotonic()
              try:
                  completed = subprocess.run([sys.executable, '-c', REQUEST_CODE],
                                             capture_output=True, text=True, timeout=timeout, check=True)
                  result = json.loads(completed.stdout)
                  if not isinstance(result, dict):
                      raise ValueError('Invalid sanitized response')
              except Exception:
                  result = {'status': None, 'transport_error': True}
              return {**result, 'elapsed_ms': round((time.monotonic()-started)*1000)}
          
          results = []
          attempts = 1
          baseline = request(5)
          results.append({'phase': 'baseline', **baseline})
          if baseline.get('status') != 404 or baseline.get('access'):
              print(json.dumps({'verdict': 'INCONCLUSIVE', 'attempts': attempts, 'results': results}))
              raise SystemExit('Baseline not an authenticated 404; no burst performed')
          
          lock = threading.Lock()
          stop = threading.Event()
          fatal = threading.Event()
          start = time.monotonic()
          deadline = start + 8
          
          def worker():
              global attempts
              while not stop.is_set():
                  with lock:
                      remaining = deadline - time.monotonic()
                      if stop.is_set() or attempts >= MAX_ATTEMPTS - 1 or remaining <= 0:
                          return
                      attempts += 1
                  result = request(min(5, remaining))
                  with lock:
                      results.append({'phase': 'burst', 'offset_ms': round((time.monotonic()-start)*1000), **result})
                      attributable = result.get('edge_1015') and result.get('status') in (403, 429)
                      if result.get('access') or result.get('transport_error') or (result.get('status') != 404 and not attributable):
                          fatal.set()
                          stop.set()
                      elif attributable:
                          stop.set()
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              list(pool.map(lambda _: worker(), range(16)))
          burst_elapsed = round((time.monotonic()-start)*1000)
          if burst_elapsed > 13000:
              fatal.set()
          if fatal.is_set():
              print(json.dumps({'verdict': 'INCONCLUSIVE', 'fatal_abort': True, 'attempts': attempts, 'burst_elapsed_ms': burst_elapsed, 'results': results}))
              raise SystemExit('Fatal burst response or deadline exceeded; no recovery request sent')
          time.sleep(12)
          attempts += 1
          recovery = request(5)
          results.append({'phase': 'recovery', **recovery})
          edge = [x for x in results if x.get('phase') == 'burst' and x.get('edge_1015') and x.get('status') in (403, 429)]
          passed = bool(edge) and not fatal.is_set() and baseline.get('status') == 404 and recovery.get('status') == 404 and not recovery.get('access')
          report = {'verdict': 'PASS' if passed else 'INCONCLUSIVE', 'attempts': attempts,
                    'burst_elapsed_ms': burst_elapsed, 'results': results}
          encoded = json.dumps(report, sort_keys=True)
          print(encoded)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Bounded staging calendar edge verification\n\n```json\n' + encoded + '\n```\n')
          if not passed:
              raise SystemExit('No attributable threshold evidence; do not retry automatically')
          PYTHON
