name: Verify staging calendar edge enforcement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Bounded staging-only verification
    runs-on: ${{ fromJSON(vars.RUNNER_DEPLOY || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 2
    environment: staging
    steps:
      - name: Verify existing Access identity and edge threshold
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PYTHON'
          import concurrent.futures
          import json
          import os
          import re
          import subprocess
          import select
          import sys
          import threading
          import time
          import urllib.error
          import urllib.request
          
          URL = 'https://staging.planned.travel/api/feed/cez-902-enforcement-probe-invalid'
          MAX_ATTEMPTS = 140
          AUTH = {'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'],
                  'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET']}
          if not all(AUTH.values()):
              raise SystemExit('Missing existing Access identity; no requests sent')
          
          REQUEST_CODE = "import http.client\nimport json\nimport os\nimport re\nimport sys\n\nHOST = 'staging.planned.travel'\nPATH = '/api/feed/cez-902-enforcement-probe-invalid'\nHEADERS = {'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'],\n           'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET'],\n           'User-Agent': 'Mozilla/5.0 (compatible; PlannedTravelVerification/1.0; +https://planned.travel)',\n           'Accept': 'text/plain'}\nconnection = http.client.HTTPSConnection(HOST, timeout=5)\ntry:\n    for line in sys.stdin:\n        try:\n            command = json.loads(line)\n            timeout = min(5, max(0.001, float(command['timeout'])))\n            connection.timeout = timeout\n            if connection.sock is not None:\n                connection.sock.settimeout(timeout)\n            connection.request('GET', PATH, headers=HEADERS)\n            response = connection.getresponse()\n            body = response.read(65537).decode('utf-8', 'replace')\n            ray = response.getheader('cf-ray', '')\n            result = {'status': response.status,\n                      'ray': ray if re.fullmatch(r'[0-9a-fA-F]+-[A-Z]{3}', ray) else None,\n                      'edge_1015': bool(re.search(r'(?:Error\\s*(?:code\\s*)?(?:</?[^>]+>\\s*)*1015|error-code[^>]*>1015)', body, re.I)),\n                      'access': '.cloudflareaccess.com/' in response.getheader('location', '')}\n            if len(body.encode('utf-8')) > 65536:\n                result = {'status': None, 'transport_error': True}\n            response.close()\n        except Exception:\n            result = {'status': None, 'transport_error': True}\n        print(json.dumps(result), flush=True)\n        if result.get('transport_error'):\n            break\nfinally:\n    connection.close()\n"
          
          class Client:
              def __init__(self):
                  self.process = subprocess.Popen([sys.executable, '-u', '-c', REQUEST_CODE],
                                                  stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                                  stderr=subprocess.DEVNULL)
                  os.set_blocking(self.process.stdout.fileno(), False)
                  self.buffer = b''
          
              def close(self):
                  if self.process.poll() is None:
                      self.process.terminate()
                      try:
                          self.process.wait(timeout=0.2)
                      except subprocess.TimeoutExpired:
                          self.process.kill()
                          self.process.wait()
                  self.process.stdin.close()
                  self.process.stdout.close()
          
              def request(self, timeout):
                  started = time.monotonic()
                  deadline = started + timeout
                  try:
                      self.process.stdin.write((json.dumps({'timeout': timeout})+'\n').encode())
                      self.process.stdin.flush()
                      while b'\n' not in self.buffer:
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise TimeoutError()
                          ready, _, _ = select.select([self.process.stdout], [], [], remaining)
                          if not ready:
                              raise TimeoutError()
                          chunk = os.read(self.process.stdout.fileno(), 4096)
                          if not chunk:
                              raise EOFError()
                          self.buffer += chunk
                          if len(self.buffer) > 4096:
                              raise ValueError('Oversized sanitized result')
                      line, self.buffer = self.buffer.split(b'\n', 1)
                      result = json.loads(line)
                      if not isinstance(result, dict):
                          raise ValueError('Invalid sanitized result')
                  except Exception:
                      result = {'status': None, 'transport_error': True}
                      self.close()
                  return {**result, 'elapsed_ms': round((time.monotonic()-started)*1000)}
          
          def request(timeout):
              client = Client()
              try:
                  return client.request(timeout)
              finally:
                  if not client.process.stdin.closed:
                      client.close()
          
          results = []
          attempts = 1
          baseline = request(5)
          results.append({'phase': 'baseline', **baseline})
          if baseline.get('status') != 404 or baseline.get('access'):
              print(json.dumps({'verdict': 'INCONCLUSIVE', 'attempts': attempts, 'results': results}))
              raise SystemExit('Baseline not an authenticated 404; no burst performed')
          
          lock = threading.Lock()
          stop = threading.Event()
          fatal = threading.Event()
          start = time.monotonic()
          deadline = start + 8
          
          def worker():
              global attempts
              client = Client()
              try:
                  while not stop.is_set():
                      with lock:
                          remaining = deadline - time.monotonic()
                          if stop.is_set() or attempts >= MAX_ATTEMPTS - 1 or remaining <= 0:
                              return
                          attempts += 1
                      result = client.request(min(5, remaining))
                      with lock:
                          results.append({'phase': 'burst', 'offset_ms': round((time.monotonic()-start)*1000), **result})
                          attributable = result.get('edge_1015') and result.get('status') in (403, 429)
                          if result.get('access') or result.get('transport_error') or (result.get('status') != 404 and not attributable):
                              fatal.set()
                              stop.set()
                          elif attributable:
                              stop.set()
              finally:
                  if not client.process.stdin.closed:
                      client.close()
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(lambda _: worker(), range(4)))
          
          burst_elapsed = round((time.monotonic()-start)*1000)
          if burst_elapsed > 13000:
              fatal.set()
          if fatal.is_set():
              print(json.dumps({'verdict': 'INCONCLUSIVE', 'fatal_abort': True, 'attempts': attempts, 'burst_elapsed_ms': burst_elapsed, 'results': results}))
              raise SystemExit('Fatal burst response or deadline exceeded; no recovery request sent')
          time.sleep(12)
          attempts += 1
          recovery = request(5)
          results.append({'phase': 'recovery', **recovery})
          edge = [x for x in results if x.get('phase') == 'burst' and x.get('edge_1015') and x.get('status') in (403, 429)]
          passed = bool(edge) and not fatal.is_set() and baseline.get('status') == 404 and recovery.get('status') == 404 and not recovery.get('access')
          report = {'verdict': 'PASS' if passed else 'INCONCLUSIVE', 'attempts': attempts,
                    'burst_elapsed_ms': burst_elapsed, 'results': results}
          encoded = json.dumps(report, sort_keys=True)
          print(encoded)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Bounded staging calendar edge verification\n\n```json\n' + encoded + '\n```\n')
          if not passed:
              raise SystemExit('No attributable threshold evidence; do not retry automatically')
          PYTHON
