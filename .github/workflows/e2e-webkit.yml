name: e2e · webkit

# The WebKit half of the critical journeys, on its own schedule instead of on every
# pull request.
#
# Why it is a workflow of its own. `mobile-safari` is the slower half of the suite and
# it was costing a pull request the larger half of every e2e event on a shared,
# self-hosted pool. Measured on the 2-vCPU runner (run 35101667571): `--shard` splits
# by test count with no project filter, the split fell along project lines, and shard 1
# — all chromium — finished its 52 tests in 882 s while shard 2 — all `mobile-safari` —
# needed more than the 900 s `globalTimeout` it had for the same 52. That is issue #466:
# CI red with nothing failing.
#
# The coverage is not being retired, only moved off the pull-request path (issue #552).
# WebKit has caught defects Chromium cannot see — an `Intl` divergence between WebKit
# and workerd across the locale catalogue (`e2e/i18n-runtime-parity.spec.ts`), a date
# heading hydration mismatch (`e2e/trips-core.spec.ts`), a module-import page error on
# every console route (`e2e/helpers/admin.ts`) — and journey 7 exists for the 393px
# composition alone (`e2e/journeys.spec.ts`). What changed is when the answer arrives:
# within a day, against `develop`, instead of within the hour, against a branch.
#
# It could not live in `ci.yml` as a post-merge job. `deploy-staging` and
# `deploy-production` there have `e2e-report` in their `needs`, so a WebKit shard that
# runs out of wall clock would block the staging deploy — #466 again, one branch over.
# Here it blocks nothing.
#
# Two things a reader should know before relying on it:
#   - BOTH triggers below are read from the repository's DEFAULT branch: a cron fires only
#     from there, and `workflow_dispatch` is only offered for a workflow file already
#     present there. So this file has to reach `main` before either one works, and until a
#     `develop` -> `main` promotion carries it across, `mobile-safari` runs in no CI job at
#     all — `pnpm e2e --project=mobile-safari` locally is the only way to ask for it
#     meanwhile (ADR 0022). Once the cron does fire, the run checks out `develop`
#     explicitly (below) because that is where a regression lands first.
#   - GitHub disables a schedule after 60 days without repository activity, and a failed
#     scheduled run notifies the last person to touch the file, nobody else. This is a
#     net, not a gate.
on:
  schedule:
    # 03:30 UTC daily — the pool is idle, and the result is waiting before the first
    # pull request of the day. Away from the 06:00 sentry-triage sweep.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to run the WebKit journeys against'
        type: string
        default: develop

# One run at a time, never cancelled: a nightly that supersedes itself reports on
# whichever commit happened to be last, which is the one thing this job must not do.
concurrency:
  group: e2e-webkit
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  # What takes `mobile-safari` out of `playwright.config.ts` on every other CI run, and
  # puts it back here. Without it `--project=mobile-safari` below fails with "project not
  # found", which is deliberate: a silent empty run is the failure mode worth refusing.
  E2E_WEBKIT: '1'
  # Inlined into the bundle by Vite, exactly as in ci.yml — the build the journeys walk
  # has to be the build a customer gets.
  VITE_POLAR_PRODUCT_SOLO_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_MONTHLY }}
  VITE_POLAR_PRODUCT_SOLO_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_SOLO_YEARLY }}
  VITE_POLAR_PRODUCT_CREW_MONTHLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_MONTHLY }}
  VITE_POLAR_PRODUCT_CREW_YEARLY: ${{ vars.VITE_POLAR_PRODUCT_CREW_YEARLY }}

jobs:
  # Two shards, the same count `ci.yml` uses and for the same reason: one Playwright
  # worker a shard on a 2-vCPU runner, and 51 declarations do not divide usefully past
  # two. The arithmetic that sizes it: the project's 51 tests cost more than 900 s
  # whole, so half of them is the change that brings a shard back inside `globalTimeout`
  # — which is why this job needs no timeout of its own beyond ci.yml's 35 minutes.
  e2e-webkit:
    name: e2e · webkit (${{ matrix.shard }}/2)
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # A schedule hands this workflow the default branch; the regression worth
          # catching is on `develop`, which is ahead of it.
          ref: ${{ inputs.ref || 'develop' }}

      - name: Prepare the e2e environment
        uses: ./.github/actions/e2e-env
        with:
          # `chromium` as well as `webkit`: the `mobile-safari` project depends on
          # `setup`, which signs in through Desktop Chrome.
          browsers: 'chromium webkit'
          # Both shards seed identical databases; auditing the seed once is proof
          # enough, and 25 s off the other shard's critical path.
          verify-seed: ${{ matrix.shard == 1 }}

      - name: Run this shard of the WebKit journeys
        id: tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: pnpm exec playwright test --project=mobile-safari --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list,github,json

      - name: Select failure and flaky diagnostics
        id: diagnostics
        if: always()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/ci/e2e-diagnostics.mjs >> "$GITHUB_OUTPUT"

      - name: Upload failure and flaky diagnostics
        if: ${{ always() && (steps.tests.outcome != 'success' || steps.diagnostics.outputs.upload != 'false') }}
        continue-on-error: true
        uses: design4pro/.github/actions/artifact-upload@main
        with:
          name: e2e-webkit-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            test-results/results.json
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/error-context.md
            e2e-runtime.log
            dev-server.log

  # This aggregate depends only on test outcomes, not artifact storage. A cancelled run has no
  # outcome to aggregate, so it does not take a `ci` slot.
  e2e-webkit-report:
    name: e2e · webkit merged report
    needs: e2e-webkit
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RUNNER_CI || '["self-hosted","linux","X64","ci"]') }}
    timeout-minutes: 2
    steps:
      - name: Require every WebKit shard to pass
        env:
          SHARDS_RESULT: ${{ needs.e2e-webkit.result }}
        run: |
          if [ "$SHARDS_RESULT" = success ]; then exit 0; fi
          echo "::error::Required WebKit shards did not pass: $SHARDS_RESULT"
          exit 1
