# Dependency updates, grouped so a week is one or two pull requests rather than fifteen.
#
# `dependencies` is the Open Mercato category for a bump, and it is the only label here (ADR 0032).
# Naming it explicitly is what keeps Dependabot's own per-ecosystem defaults (`javascript`,
# `github_actions`) off: it adds those only when `labels` is unset or names a missing label.
#
# One pin is load-bearing and is deliberately NOT ignored here, because a bump to it has to be
# followed by a matching edit and it is better that the pull request exists and goes red:
#   * `@playwright/test` - the container image tag `mcr.microsoft.com/playwright:v<version>-noble`
#     in ci.yml has to move with it.
#
# `wrangler` used to be the second. The shipping workflows no longer name a version, so a bump
# needs no edit anywhere: the lockfile is the only place it is written down (#567).
#
# The `@tanstack/*` packages pinned to `latest` are inert here: the range is satisfied by every
# release, so Dependabot has nothing to raise. They move when the lockfile is refreshed by hand.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Git Flow: `develop` is the integration branch and every pull request targets it
    # (docs/adr/0003-git-flow-develop-as-staging.md). Without this Dependabot uses the
    # repository's default branch, which is `main` - a bump would arrive as a direct
    # pull request against production.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    groups:
      # The framework moves as a unit; a TanStack Router bump without the matching Start bump is
      # a type error, not an update.
      tanstack:
        patterns:
          - '@tanstack/*'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # The ORM and the generator write and read the same migrations. Split them and CI's
      # db-drift rung goes red on a diff nobody made.
      drizzle:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-kit'
      # One release is one Sentry release across both bundles (see the deploy workflows); the SDK
      # halves and the source-map uploader are versioned together upstream.
      sentry:
        patterns:
          - '@sentry/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
          - '@testing-library/*'
      # Everything else, as long as it is not a major. Majors stay individual so each gets its
      # own review and its own red CI run.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Workflows live at the root; the composite actions need naming separately, because
    # Dependabot resolves `uses:` per directory that holds the file.
    directories:
      - /
      - /.github/actions/setup
      - /.github/actions/e2e-env
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(ci)'
      include: scope
    groups:
      actions:
        patterns:
          - '*'
