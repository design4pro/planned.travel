name: Prepare the e2e environment
description: >
  Everything the Playwright suite needs before a single spec runs: dependencies,
  a migrated local D1, a dev server on port 3000 and the seeded demo workspace
  behind it. Optionally the PMTiles basemap in the local R2 simulator - see the
  `basemap` input, which is off.

  Brings its own browsers. The step below installs exactly the projects the
  caller asks for, on every runner, because only the pool's image ships them
  preinstalled and no context distinguishes that image from a hosted one. The
  version installed is the one `pnpm install` just resolved from the lockfile,
  so nothing is pinned twice, and an image whose browsers have drifted from the
  lockfile is corrected rather than trusted. Their system libraries are asked
  for only where the job can elevate to install them - see the step.

inputs:
  basemap:
    description: >
      Pull the PMTiles archive out of production R2 into the local simulator.

      Off, because no journey needs it. The land, water and borders the atlas
      journeys click on come from Natural Earth 1:110m in the bundle, not from
      the archive - `src/lib/map/world.ts` carries that fallback precisely
      because the archive is "routinely absent in development and on a cold
      bucket", and `map-canvas.tsx` probes it once and builds the map either
      way. Measured on this branch: the six atlas journeys are green against an
      empty `.e2e-tiles/`, `data-map-ready` latches on MapLibre's `idle` as it
      does with tiles, and no journey asserts a coverage note or a street.

      Turning it on costs a ~480 MB cache restore on every shard and, because
      the download needs an R2 token, makes the job unrunnable on a fork. Both
      inputs below are required only when this is 'true'.
    required: false
    default: 'false'
  cloudflare-api-token:
    description: >
      Token with R2:read on planned-travel-tiles. Only used to pull the basemap
      archive out of production R2 into the local simulator.
    required: false
  cloudflare-account-id:
    description: Cloudflare account that owns the bucket.
    required: false
  tiles-key:
    description: >
      Regional archive key, e.g. basemaps/japan-20260818.pmtiles. The action
      downloads the entire object, not a geographic subset; never use a planet
      archive on a runner.
      Dated and immutable by policy (docs/DEPLOY.md 7.4), which is what makes it
      a sound cache key.
    required: false
  browsers:
    description: >
      Space-separated Playwright browsers to install. `chromium` covers the
      `setup` and `chromium` projects, which is what the critical journeys run;
      the WebKit suite passes `chromium webkit`, because its `mobile-safari`
      project still depends on `setup`.
    required: false
    default: 'chromium'
  verify-seed:
    description: >
      Run scripts/seed/verify.mjs after seeding. On by default; the sharded gate
      turns it off on all but one shard, since every shard seeds the same
      fixture and the audit costs ~25 s of wrangler subprocesses.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up the toolchain
      uses: ./.github/actions/setup

    # Unconditional on purpose. Exactly one image in play carries the browsers -
    # the pool's, which is built FROM `mcr.microsoft.com/playwright` - and no
    # context can see that: `runner.environment` reports `self-hosted` for the
    # pool and for any other non-GitHub runner alike, so gating on it would skip
    # the install exactly where it is needed. Assuming the image instead is what
    # made this repository's documented escape hatch fictional: with
    # `vars.RUNNER_CI` set to `["ubuntu-latest"]` during a host outage both e2e
    # shards died on a missing browser executable, so a code pull request could
    # only reach `develop` through an admin bypass, which skips the checks
    # rather than running them (ADR 0023's own consequence; ADR 0026 repairs it).
    # The install is idempotent, costs seconds against a store that already has
    # the right build, and repairs a stale one rather than failing mid-suite.
    #
    # `--with-deps` is the half that cannot be cached - it is apt, not a
    # tarball - which is why this step is a plain install rather than a restore.
    - name: Install the browsers
      shell: bash
      run: |
        # The browsers, always. The system libraries only where they can actually
        # be installed: `--with-deps` is apt, and playwright-core's
        # `transformCommandsForRoot` runs it under `sudo` when the process is not
        # root, falling back to `su root -c`, which cannot work unattended. The
        # pool's container runs as an unprivileged `runner` and carries no sudo -
        # and needs none, being built FROM the Playwright image, whose libraries
        # are already in place. Asking for them there would fail the job; asking
        # for the browsers costs a no-op.
        if [ "$(id -u)" = 0 ] || command -v sudo >/dev/null 2>&1; then
          pnpm exec playwright install --with-deps ${{ inputs.browsers }}
        else
          pnpm exec playwright install ${{ inputs.browsers }}
        fi

    - name: Generate route tree
      shell: bash
      run: pnpm generate-routes

    # `vite dev` loads this through Miniflare exactly as `wrangler secret put`
    # does in production. Every value here is a throwaway for a database that
    # exists for the length of this job: nothing signs anything that outlives it.
    - name: Write .dev.vars
      shell: bash
      run: |
        set -euo pipefail
        cat > .dev.vars <<EOF
        BETTER_AUTH_SECRET=$(openssl rand -base64 32)
        APP_URL=http://localhost:3000
        TILES_ARCHIVE_KEY=basemaps/e2e.pmtiles
        EOF
        # The key is written whether or not the object exists behind it. With
        # `basemap: false` /api/tiles/* answers 404 and the map draws its
        # bundled world instead, which is the same path a cold bucket takes in
        # production.

    - name: Apply D1 migrations
      shell: bash
      run: pnpm db:migrate:local

    # Only when `basemap` is on. The archive is ~480 MB and immutable under its
    # dated key, so a hit here is the normal case and the download below runs
    # once per new basemap.
    #
    # Restore and save are separate steps on purpose. `actions/cache` saves in a
    # post step that is skipped when the job fails, so a red run after a miss
    # left the next run missing again — measured: four consecutive misses on
    # `main`. Saving right after the download makes the entry independent of
    # the suite's verdict. Six shards missing at once all try to save the same
    # key; the first wins and the rest log a reservation warning, not an error.
    - name: Restore the basemap archive
      id: tiles-cache
      if: inputs.basemap == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .e2e-tiles/basemap.pmtiles
        key: pmtiles-${{ inputs.tiles-key }}

    - name: Download the basemap archive from R2
      if: inputs.basemap == 'true' && steps.tiles-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        set -euo pipefail
        mkdir -p .e2e-tiles
        pnpm exec wrangler r2 object get \
          "planned-travel-tiles/${{ inputs.tiles-key }}" \
          --remote --file .e2e-tiles/basemap.pmtiles

    - name: Save the basemap archive to the cache
      if: inputs.basemap == 'true' && steps.tiles-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .e2e-tiles/basemap.pmtiles
        key: pmtiles-${{ inputs.tiles-key }}

    # Into the Miniflare bucket under the key .dev.vars names, so /api/tiles/*
    # resolves the same way it does on your machine.
    - name: Load the archive into the local R2 simulator
      if: inputs.basemap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm exec wrangler r2 object put \
          planned-travel-tiles/basemaps/e2e.pmtiles \
          --local --file .e2e-tiles/basemap.pmtiles \
          --content-type application/octet-stream

    # Started here rather than by Playwright's `webServer` because the seed has
    # to run against it before the first spec: the seed endpoint lives inside the
    # Worker, so there is no seeding a database without a server in front of it.
    - name: Start the dev server
      shell: bash
      # E2E=1 is what vite.config.ts reads to turn the devtools console relay off. Without it the
      # Worker's own console.error lines - the seeded sign-up's auth email dead-letters here,
      # because this environment carries no EMAIL_API_KEY - are streamed into whichever browser
      # page Playwright happens to have open, and the spec holding that page fails on someone
      # else's background error. Scoped to this step so the seed and the suite do not inherit it.
      env:
        E2E: '1'
      run: |
        set -euo pipefail
        # --host binds v4 and v6. The wait loop below (curl) reaches a
        # ::1-only vite over IPv6 and reports the server up, but Node's fetch
        # in seed.mjs resolves localhost to 127.0.0.1 and then finds nothing —
        # the seed fails against a server curl just proved alive. Same trap,
        # same fix as .ai/scripts/test-env-up.sh.
        pnpm exec vite dev --port 3000 --host > dev-server.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl --silent --fail --output /dev/null http://localhost:3000/; then
            echo "dev server up"
            exit 0
          fi
          sleep 2
        done
        echo "::error title=Dev server::did not answer on :3000 within 120s"
        tail -50 dev-server.log
        exit 1

    # Diagnostic instrumentation, and a step of its own on purpose: the step
    # above ends in `exit 0` inside its wait loop, so anything appended to it
    # would never run.
    #
    # What it is for. Run 35101667571 pointed it at #466, and the answer was
    # that nothing runs out. Across a whole shard `MemAvailable` never fell below
    # 19 GB of 32 GB, the vite/workerd process count never moved off three, and
    # `.wrangler` reached 24 MB. The shard is not exhausting a resource, it is
    # running out of wall clock: Playwright cut shard 2 at `globalTimeout` with
    # `20 did not run`, after spending 340 s of its 900 s on two tests that blew
    # the 10 s hydration budget and then passed on retry.
    #
    # It also showed two things no blob report can. Both shards print the same
    # `load1` in the same second, so the runners share one host and sharding buys
    # no isolation. And the split fell along the browser projects: shard 1 was
    # all chromium and finished its 52 tests in 882 s, shard 2 was all
    # mobile-safari and needed more than the 900 s it had for the same 52. WebKit
    # was what made the second shard the one that dies - not a leak, and not the
    # dev server the two of them share.
    #
    # That measurement is what moved `mobile-safari` off the pull-request path
    # (#552): the ci.yml e2e job now runs chromium alone and splits those same 52
    # tests two ways, and WebKit runs nightly in `e2e-webkit.yml`, sharded the same
    # way against its own project. So the numbers above describe the arrangement
    # that was changed, not the one a reader will see in a fresh run - both this
    # workflow's shards should now sit near half of what shard 1 took.
    #
    # Kept because the next question needs the same signals, and because
    # `dev-server.log` is written by every run and was kept by none, so a red
    # shard used to leave no server-side evidence at all. `MemAvailable` covers
    # heap exhaustion, `loadavg` CPU saturation, the process count accumulating
    # workerd children, and the size of `.wrangler` the state the suite writes
    # and never cleans up - the whole directory rather than its `d1/` alone,
    # because the run also stages import answers in KV and puts uploaded files in
    # R2. Walking it costs 0.02 s a sample, measured on a 3.4 GB one, so the
    # instrument does not perturb what it measures.
    #
    # `/proc` rather than `ps`, so nothing depends on procps being in the image,
    # and `VmRSS` rather than `statm`, which counts pages: this pool is ARM64,
    # where a 64 KiB page would make a 4 KiB assumption wrong by sixteen times
    # without saying so. `nproc` because the first run of this sampler recorded a
    # `load1` of 17 and left the core count unknowable, which made the number
    # unreadable; `esbuild` in the match because that run terminated an esbuild
    # child the filter had not been counting.
    #
    # Every failure is swallowed and the loop can never fail the job. An
    # instrument that reddens a run is worse than no instrument. It costs one
    # sample per 15 s - 62 lines across a full shard, measured.
    - name: Sample the dev server's resource use
      shell: bash
      run: |
        set -uo pipefail
        cores=$(nproc 2>/dev/null || awk '/^processor/{n++}END{print n+0}' /proc/cpuinfo 2>/dev/null)
        {
          printf 'iso\tnproc\tmem_avail_kb\tmem_total_kb\tload1\tprocs\trss_total_kb\twrangler_kb\tdetail\n'
          while :; do
            avail=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo 2>/dev/null)
            total=$(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null)
            load1=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null)
            wrangler=$(du -sk .wrangler 2>/dev/null | cut -f1)
            procs=0
            rss_total=0
            detail=''
            for entry in /proc/[0-9]*; do
              cmd=$(tr '\0' ' ' < "$entry/cmdline" 2>/dev/null) || continue
              case "$cmd" in
                *vite*|*workerd*|*miniflare*|*esbuild*) ;;
                *) continue ;;
              esac
              rss=$(awk '/^VmRSS:/{print $2}' "$entry/status" 2>/dev/null)
              [ -n "$rss" ] || continue
              procs=$((procs + 1))
              rss_total=$((rss_total + rss))
              detail="${detail}${entry##*/}:${rss};"
            done
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +%FT%TZ)" "${cores:-?}" "${avail:-?}" "${total:-?}" "${load1:-?}" \
              "$procs" "$rss_total" "${wrangler:-?}" "${detail:-none}"
            sleep 15
          done
        } >> e2e-runtime.log 2>/dev/null &

    - name: Seed the demo workspace
      shell: bash
      run: node scripts/seed/seed.mjs

    - name: Verify the seed
      if: inputs.verify-seed == 'true'
      shell: bash
      run: node scripts/seed/verify.mjs
