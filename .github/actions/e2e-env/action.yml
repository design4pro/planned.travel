name: Prepare the e2e environment
description: >
  Everything the Playwright suite needs before a single spec runs: dependencies,
  a migrated local D1, a dev server on port 3000 and the seeded demo workspace
  behind it. Optionally the PMTiles basemap in the local R2 simulator - see the
  `basemap` input, which is off.

  Assumes a runner that already carries the browsers. That used to mean a job
  running in `mcr.microsoft.com/playwright:v<version>-noble`; it now means the
  self-hosted pool, whose image is built FROM exactly that. Installing them per
  run costs a couple of minutes and pins nothing extra.

inputs:
  basemap:
    description: >
      Pull the PMTiles archive out of production R2 into the local simulator.

      Off, because no journey needs it. The land, water and borders the atlas
      journeys click on come from Natural Earth 1:110m in the bundle, not from
      the archive - `src/lib/map/world.ts` carries that fallback precisely
      because the archive is "routinely absent in development and on a cold
      bucket", and `map-canvas.tsx` probes it once and builds the map either
      way. Measured on this branch: the six atlas journeys are green against an
      empty `.e2e-tiles/`, `data-map-ready` latches on MapLibre's `idle` as it
      does with tiles, and no journey asserts a coverage note or a street.

      Turning it on costs a ~480 MB cache restore on every shard and, because
      the download needs an R2 token, makes the job unrunnable on a fork. Both
      inputs below are required only when this is 'true'.
    required: false
    default: 'false'
  cloudflare-api-token:
    description: >
      Token with R2:read on planned-travel-tiles. Only used to pull the basemap
      archive out of production R2 into the local simulator.
    required: false
  cloudflare-account-id:
    description: Cloudflare account that owns the bucket.
    required: false
  tiles-key:
    description: >
      Object key of the archive to pull, e.g. basemaps/planet-20260818.pmtiles.
      Dated and immutable by policy (docs/DEPLOY.md 7.4), which is what makes it
      a sound cache key.
    required: false
  verify-seed:
    description: >
      Run scripts/seed/verify.mjs after seeding. On by default; the sharded gate
      turns it off on all but one shard, since every shard seeds the same
      fixture and the audit costs ~25 s of wrangler subprocesses.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up the toolchain
      uses: ./.github/actions/setup

    - name: Generate route tree
      shell: bash
      run: pnpm generate-routes

    # `vite dev` loads this through Miniflare exactly as `wrangler secret put`
    # does in production. Every value here is a throwaway for a database that
    # exists for the length of this job: nothing signs anything that outlives it.
    - name: Write .dev.vars
      shell: bash
      run: |
        set -euo pipefail
        cat > .dev.vars <<EOF
        BETTER_AUTH_SECRET=$(openssl rand -base64 32)
        APP_URL=http://localhost:3000
        TILES_ARCHIVE_KEY=basemaps/e2e.pmtiles
        EOF
        # The key is written whether or not the object exists behind it. With
        # `basemap: false` /api/tiles/* answers 404 and the map draws its
        # bundled world instead, which is the same path a cold bucket takes in
        # production.

    - name: Apply D1 migrations
      shell: bash
      run: pnpm db:migrate:local

    # Only when `basemap` is on. The archive is ~480 MB and immutable under its
    # dated key, so a hit here is the normal case and the download below runs
    # once per new basemap.
    #
    # Restore and save are separate steps on purpose. `actions/cache` saves in a
    # post step that is skipped when the job fails, so a red run after a miss
    # left the next run missing again — measured: four consecutive misses on
    # `main`. Saving right after the download makes the entry independent of
    # the suite's verdict. Six shards missing at once all try to save the same
    # key; the first wins and the rest log a reservation warning, not an error.
    - name: Restore the basemap archive
      id: tiles-cache
      if: inputs.basemap == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .e2e-tiles/basemap.pmtiles
        key: pmtiles-${{ inputs.tiles-key }}

    - name: Download the basemap archive from R2
      if: inputs.basemap == 'true' && steps.tiles-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        set -euo pipefail
        mkdir -p .e2e-tiles
        pnpm exec wrangler r2 object get \
          "planned-travel-tiles/${{ inputs.tiles-key }}" \
          --remote --file .e2e-tiles/basemap.pmtiles

    - name: Save the basemap archive to the cache
      if: inputs.basemap == 'true' && steps.tiles-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .e2e-tiles/basemap.pmtiles
        key: pmtiles-${{ inputs.tiles-key }}

    # Into the Miniflare bucket under the key .dev.vars names, so /api/tiles/*
    # resolves the same way it does on your machine.
    - name: Load the archive into the local R2 simulator
      if: inputs.basemap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm exec wrangler r2 object put \
          planned-travel-tiles/basemaps/e2e.pmtiles \
          --local --file .e2e-tiles/basemap.pmtiles \
          --content-type application/octet-stream

    # Started here rather than by Playwright's `webServer` because the seed has
    # to run against it before the first spec: the seed endpoint lives inside the
    # Worker, so there is no seeding a database without a server in front of it.
    - name: Start the dev server
      shell: bash
      # E2E=1 is what vite.config.ts reads to turn the devtools console relay off. Without it the
      # Worker's own console.error lines - the seeded sign-up's auth email dead-letters here,
      # because this environment carries no EMAIL_API_KEY - are streamed into whichever browser
      # page Playwright happens to have open, and the spec holding that page fails on someone
      # else's background error. Scoped to this step so the seed and the suite do not inherit it.
      env:
        E2E: '1'
      run: |
        set -euo pipefail
        # --host binds v4 and v6. The wait loop below (curl) reaches a
        # ::1-only vite over IPv6 and reports the server up, but Node's fetch
        # in seed.mjs resolves localhost to 127.0.0.1 and then finds nothing —
        # the seed fails against a server curl just proved alive. Same trap,
        # same fix as .ai/scripts/test-env-up.sh.
        pnpm exec vite dev --port 3000 --host > dev-server.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl --silent --fail --output /dev/null http://localhost:3000/; then
            echo "dev server up"
            exit 0
          fi
          sleep 2
        done
        echo "::error title=Dev server::did not answer on :3000 within 120s"
        tail -50 dev-server.log
        exit 1

    # Diagnostic instrumentation, and a step of its own on purpose: the step
    # above ends in `exit 0` inside its wait loop, so anything appended to it
    # would never run.
    #
    # What it is for. A red shard's failures are not in any one test: every
    # operation slows about fivefold over the shard's life. Measured on run
    # 35084673235, comparing the same work early against late in the same shard -
    # `/trips` 0.60 s against 3.68 s, `/dashboard` 0.42 s against 4.43 s, and the
    # `beforeEach` that only restores a session and touches no database, 0.05 s
    # against 1.03 s. Both browser projects show it at once, so the cause is not
    # in a browser; the one long-lived `vite dev` and its workerd children are
    # what they share. The hydration wait in `e2e/helpers/settle.ts` is then
    # simply the narrowest budget in the suite and so the first to break, and the
    # `globalTimeout` amputation of #466 is the same slowdown seen from the other
    # end.
    #
    # Which resource runs out is not decidable from the blob reports, and
    # `dev-server.log` is written but never kept, so the red runs have left no
    # server-side evidence at all. These four signals separate the candidates
    # that survive: `MemAvailable` for heap exhaustion, `loadavg` for CPU
    # saturation, the process count for accumulating workerd children, and the
    # size of `.wrangler` for the state the suite writes and never cleans up -
    # the whole directory rather than its `d1/` alone, because the run also
    # stages import answers in KV and puts uploaded files in R2, so narrowing it
    # to the database would measure a fraction of the growth. Walking it costs
    # 0.02 s a sample, measured on a 3.4 GB one, so the instrument does not
    # perturb what it measures.
    #
    # `/proc` rather than `ps`, so nothing depends on procps being in the image,
    # and `VmRSS` rather than `statm`, which counts pages: this pool is ARM64,
    # where a 64 KiB page would make a 4 KiB assumption wrong by sixteen times
    # without saying so.
    #
    # Every failure is swallowed and the loop can never fail the job. An
    # instrument that reddens a run is worse than no instrument. It costs one
    # sample per 15 s - about eighty lines across a full shard.
    - name: Sample the dev server's resource use
      shell: bash
      run: |
        set -uo pipefail
        {
          printf 'iso\tmem_avail_kb\tmem_total_kb\tload1\tprocs\trss_total_kb\twrangler_kb\tdetail\n'
          while :; do
            avail=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo 2>/dev/null)
            total=$(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null)
            load1=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null)
            wrangler=$(du -sk .wrangler 2>/dev/null | cut -f1)
            procs=0
            rss_total=0
            detail=''
            for entry in /proc/[0-9]*; do
              cmd=$(tr '\0' ' ' < "$entry/cmdline" 2>/dev/null) || continue
              case "$cmd" in
                *vite*|*workerd*|*miniflare*) ;;
                *) continue ;;
              esac
              rss=$(awk '/^VmRSS:/{print $2}' "$entry/status" 2>/dev/null)
              [ -n "$rss" ] || continue
              procs=$((procs + 1))
              rss_total=$((rss_total + rss))
              detail="${detail}${entry##*/}:${rss};"
            done
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +%FT%TZ)" "${avail:-?}" "${total:-?}" "${load1:-?}" \
              "$procs" "$rss_total" "${wrangler:-?}" "${detail:-none}"
            sleep 15
          done
        } >> e2e-runtime.log 2>/dev/null &

    - name: Seed the demo workspace
      shell: bash
      run: node scripts/seed/seed.mjs

    - name: Verify the seed
      if: inputs.verify-seed == 'true'
      shell: bash
      run: node scripts/seed/verify.mjs
