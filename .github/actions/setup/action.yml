name: Set up the toolchain
description: >
  pnpm, Node and a warm pnpm store, then a frozen-lockfile install.

  Every job in every workflow starts with these same four steps, and a drift
  between two copies of them is the kind of thing that shows up as a build that
  only fails in one workflow. So they live here once.

runs:
  using: composite
  steps:
    # No `version:` input on purpose. Unset, action-setup reads the
    # `packageManager` field in package.json, so the pnpm that resolves the
    # lockfile in CI is by construction the one the lockfile was written by.
    # Pinning here would be a second copy of that version, free to drift from
    # the first.
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    # Runs wherever `runner.environment` is not `github-hosted`, which covers both
    # the pool and Blacksmith; only the pool has anything to find, and the
    # `mountpoint` check below is what makes that safe to run on either.
    #
    # The self-hosted CI pool mounts a persistent pnpm store at this path
    # (`host/runner/pool.sh` in design4pro/cezar, volume `gha-pnpm-store`), and pnpm never
    # used it: action-setup exports PNPM_HOME, pnpm's default store is
    # $PNPM_HOME/store, and that lives in the disposable container. Pointed at
    # the volume, a warm install measured 11-12 s. The check is for a writable
    # mount rather than for `self-hosted`, because the agent pool carries no
    # volume on purpose, and a volume Docker created root-owned is not writable
    # by the `runner` user - either way the install falls back to a store inside
    # the container, filled from the registry.
    - name: Use the runner's persistent pnpm store
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        store="$HOME/.local/share/pnpm/store"
        if mountpoint -q "$store" && [ -w "$store" ]; then
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store: the runner's persistent volume at $store"
        else
          echo "pnpm store: none persistent here ($store is not a writable mount), filling one from the registry"
        fi

    # `cache: pnpm` caches pnpm's content-addressable store (the directory
    # `pnpm store path` prints), keyed on pnpm-lock.yaml. That is the expensive
    # half of an install; node_modules itself is relinked from the store in
    # seconds and is deliberately not cached, so a corrupted tree can never be
    # restored from a previous run.
    #
    # GitHub-hosted runners only, and off on the default Blacksmith runner for
    # the same reason it is off on the pool: from outside GitHub's own network
    # the ~209 MB tarball came down at 3-6 MB/s, about 60 s a job, while filling
    # an empty store straight from the registry measured 13-18 s on the same
    # runner image. Blacksmith sells a faster cache of its own
    # (`useblacksmith/cache`); adopting it is a separate change with a
    # measurement attached, not a side effect of moving the runner.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

    # Unconditional. An `install` input used to make this step skippable, and
    # rollback.yml was the only caller that ever turned it off - #567 took that
    # away, because wrangler-action probes `pnpm exec wrangler --version` to
    # find the wrangler it runs, and that needs a node_modules. The input went
    # with its last use rather than staying behind as a switch nothing throws.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
