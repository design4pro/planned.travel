<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      Mockup — one journey across three days, named by the part each day sees
    </title>
    <!--
      Illustrative static mockup for .ai/specs/implemented/2026-09-11-journey-in-its-day.md.
      Self-contained: inline CSS, no build step, no app code, no external requests.
      Colour and type values are copied from src/styles/tokens.css; the glyphs are
      inline SVG stand-ins for the lucide icons the real row composes.
      Placeholder data only.
    -->
    <style>
      :root {
        --color-surface: #ffffff;
        --color-surface-2: #f3f1ed;
        --color-surface-inset: #edebe6;
        --color-ink: #16150f;
        --color-ink-2: #403e36;
        --color-ink-3: #5b5951;
        --color-ink-4: #6c6a61;
        --color-edge: #e3e0d8;
        --color-edge-faint: rgb(22 21 15 / 0.07);
        --color-accent: #16150f;
        --color-accent-on: #ffffff;
        --color-brand: #256256;
        --color-success-soft: #e2f1e8;
        --color-success: #136b45;
        --text-micro: 0.6875rem;
        --text-caption: 0.75rem;
        --text-label: 0.8125rem;
        --tracking-label: 0.08em;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-full: 9999px;
      }

      [data-theme='dark'] {
        --color-surface: #1a1a18;
        --color-surface-2: #212120;
        --color-surface-inset: #292926;
        --color-ink: #f8f7f4;
        --color-ink-2: #d8d6d0;
        --color-ink-3: #adaba3;
        --color-ink-4: #93918a;
        --color-edge: #3a3a36;
        --color-edge-faint: rgb(255 255 255 / 0.08);
        --color-accent: #f8f7f4;
        --color-accent-on: #16150f;
        --color-brand: #5fbba0;
        --color-success-soft: #11251c;
        --color-success: #4cc38a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: flex;
        gap: 28px;
        padding: 28px;
        background: #6e6c66;
        font-family:
          ui-sans-serif,
          -apple-system,
          'Segoe UI',
          Inter,
          system-ui,
          sans-serif;
      }

      .theme {
        flex: 1;
      }

      .theme-name {
        margin: 0 0 10px;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: #ffffff;
      }

      .rail {
        border: 1px solid var(--color-edge);
        border-radius: var(--radius-lg);
        background: var(--color-surface-2);
        overflow: hidden;
      }

      .rail-head {
        border-bottom: 1px solid var(--color-edge-faint);
        padding: 10px 12px;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--color-ink-3);
      }

      .day {
        padding: 10px 12px;
      }

      .day + .day {
        border-top: 1px solid var(--color-edge-faint);
      }

      .day-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding-bottom: 8px;
      }

      .day-title {
        font-size: var(--text-label);
        font-weight: 600;
        color: var(--color-ink);
      }

      .day-meta {
        font-size: var(--text-caption);
        color: var(--color-ink-3);
      }

      ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 4px;
        border-radius: var(--radius-md);
        padding: 6px 6px 6px 0;
      }

      .grip {
        width: 20px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        padding-top: 10px;
        color: var(--color-ink-4);
      }

      /* The travelling and arriving rows are not draggable: a journey has one
         sort_order, and only the day it departs can give that number a meaning.
         The column is still reserved so every row shares one left edge. */
      .grip.hidden svg {
        visibility: hidden;
      }

      .body {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        flex: 1;
        border-radius: var(--radius-md);
        background: var(--color-surface);
        border: 1px solid var(--color-edge-faint);
        padding: 8px 10px;
      }

      .mode {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-md);
        background: var(--color-surface-inset);
        color: var(--color-ink-2);
        display: grid;
        place-items: center;
      }

      /* The phase label: only ever present when the journey covers more than
         one day. Naming a part makes no sense when there is only one. */
      .phase {
        display: block;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--color-ink-3);
      }

      .line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        margin-top: 2px;
      }

      .name {
        flex: 1;
        min-width: 0;
        font-size: var(--text-label);
        font-weight: 600;
        color: var(--color-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .time {
        flex-shrink: 0;
        font-size: var(--text-caption);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-2);
      }

      .time.none {
        color: var(--color-ink-4);
        font-variant-numeric: normal;
      }

      .sub {
        margin-top: 2px;
        font-size: var(--text-caption);
        color: var(--color-ink-3);
      }

      .facts {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
      }

      .fact {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-caption);
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-3);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: var(--radius-full);
        padding: 1px 8px;
        font-size: var(--text-micro);
        font-weight: 600;
        background: var(--color-success-soft);
        color: var(--color-success);
      }

      .stop-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 24px;
        font-size: var(--text-caption);
        color: var(--color-ink-3);
      }

      .dot {
        width: 22px;
        height: 22px;
        border-radius: var(--radius-sm);
        background: var(--color-surface-inset);
        display: grid;
        place-items: center;
        color: var(--color-ink-3);
        flex-shrink: 0;
      }

      .callout {
        margin: 0;
        border-top: 1px solid var(--color-edge-faint);
        padding: 12px;
        font-size: var(--text-caption);
        line-height: 1.45;
        color: var(--color-ink-3);
      }

      .callout b {
        color: var(--color-ink-2);
      }
    </style>
  </head>
  <body>
    <section class="theme" data-theme="light">
      <p class="theme-name">Light</p>
      <div class="rail" id="rail-light"></div>
    </section>

    <section class="theme" data-theme="dark">
      <p class="theme-name">Dark</p>
      <div class="rail" id="rail-dark"></div>
    </section>

    <script>
      const ICON = {
        grip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>',
        plane:
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3 3.5-2 2-2.2-.5a.5.5 0 0 0-.5.8L5 15l2.2 2.2 1.7 2.4a.5.5 0 0 0 .8-.5l-.5-2.2 2-2 3.5 3a.5.5 0 0 0 .8-.5Z"/></svg>',
        ticket:
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 6 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-6Z"/><path d="M13 7v10"/></svg>',
        pin: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
      }

      function leg(phase, time, sub, draggable, extras) {
        return `<li class="row">
          <span class="grip${draggable ? '' : ' hidden'}">${ICON.grip}</span>
          <span class="body">
            <span class="mode">${ICON.plane}</span>
            <span style="min-width:0;flex:1">
              <span class="phase">${phase}</span>
              <span class="line">
                <span class="name">Auckland to Santiago</span>
                <span class="time${time === null ? ' none' : ''}">${time ?? '—'}</span>
              </span>
              <span class="sub">${sub}</span>
              ${extras}
            </span>
          </span>
        </li>`
      }

      const extras = `<span class="facts">
        <span class="fact">${ICON.ticket}LA 800</span>
        <span class="badge">Booked</span>
      </span>`

      function stop(name) {
        return `<div class="stop-row"><span class="dot">${ICON.pin}</span>${name}</div>`
      }

      const rail = `
        <div class="rail-head">Itinerary</div>

        <div class="day">
          <div class="day-head">
            <span class="day-title">Day 8 &middot; Sun 4 May</span>
            <span class="day-meta">1 stop</span>
          </div>
          ${stop('Sky Tower &middot; 17:00')}
          <ol>${leg('Departs', '23:59', 'Auckland Airport (AKL)', true, extras)}</ol>
        </div>

        <div class="day">
          <div class="day-head">
            <span class="day-title">Day 9 &middot; Mon 5 May</span>
            <span class="day-meta">no stops</span>
          </div>
          <ol>${leg('In the air', null, 'Over the Pacific', false, '')}</ol>
        </div>

        <div class="day">
          <div class="day-head">
            <span class="day-title">Day 10 &middot; Tue 6 May</span>
            <span class="day-meta">1 stop</span>
          </div>
          <ol>${leg('Lands', '16:40', 'Santiago Airport (SCL)', false, '')}</ol>
          ${stop('Cerro San Crist&oacute;bal &middot; 19:30')}
        </div>

        <p class="callout">
          One journey, three rows, one record. Each day is labelled by the part it
          sees &mdash; <b>Departs / In the air / Lands</b> for a flight, and a
          single-day journey carries no label at all. Only the departing row has a
          drag handle: a journey has one <b>sort_order</b>, and the day it leaves is
          the only one on which that number has an unambiguous meaning.
        </p>`

      document.getElementById('rail-light').innerHTML = rail
      document.getElementById('rail-dark').innerHTML = rail
    </script>
  </body>
</html>
