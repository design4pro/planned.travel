<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mockup — a day that interleaves a stop, a journey and a note</title>
    <!--
      Illustrative static mockup for .ai/specs/2026-09-11-journey-in-its-day.md.
      Self-contained: inline CSS, no build step, no app code, no external requests.
      Colour and type values are copied from src/styles/tokens.css; the glyphs are
      inline SVG stand-ins for the lucide icons the real row composes.
      Placeholder data only.
    -->
    <style>
      :root {
        --color-surface: #ffffff;
        --color-surface-2: #f3f1ed;
        --color-surface-inset: #edebe6;
        --color-ink: #16150f;
        --color-ink-2: #403e36;
        --color-ink-3: #5b5951;
        --color-ink-4: #6c6a61;
        --color-edge: #e3e0d8;
        --color-edge-faint: rgb(22 21 15 / 0.07);
        --color-accent: #16150f;
        --color-accent-on: #ffffff;
        --color-brand: #256256;
        --text-micro: 0.6875rem;
        --text-caption: 0.75rem;
        --text-label: 0.8125rem;
        --tracking-label: 0.08em;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-full: 9999px;
      }

      [data-theme='dark'] {
        --color-surface: #1a1a18;
        --color-surface-2: #212120;
        --color-surface-inset: #292926;
        --color-ink: #f8f7f4;
        --color-ink-2: #d8d6d0;
        --color-ink-3: #adaba3;
        --color-ink-4: #93918a;
        --color-edge: #3a3a36;
        --color-edge-faint: rgb(255 255 255 / 0.08);
        --color-accent: #f8f7f4;
        --color-accent-on: #16150f;
        --color-brand: #5fbba0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: flex;
        gap: 28px;
        padding: 28px;
        background: #6e6c66;
        font-family:
          ui-sans-serif,
          -apple-system,
          'Segoe UI',
          Inter,
          system-ui,
          sans-serif;
      }

      .theme {
        flex: 1;
      }

      .theme-name {
        margin: 0 0 10px;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: #ffffff;
      }

      /* The rail: the glass panel the planner floats over the map. */
      .rail {
        border: 1px solid var(--color-edge);
        border-radius: var(--radius-lg);
        background: var(--color-surface-2);
        overflow: hidden;
      }

      .rail-head {
        border-bottom: 1px solid var(--color-edge-faint);
        padding: 10px 12px;
        font-size: var(--text-micro);
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--color-ink-3);
      }

      .day {
        padding: 10px 12px 14px;
      }

      .day-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding-bottom: 8px;
      }

      .day-title {
        font-size: var(--text-label);
        font-weight: 600;
        color: var(--color-ink);
      }

      .day-meta {
        font-size: var(--text-caption);
        color: var(--color-ink-3);
      }

      ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      /* One row of the sequence. The grip column is shared by every kind, so the
         three variants line up on the same left edge. */
      .row {
        display: flex;
        align-items: flex-start;
        gap: 4px;
        border-radius: var(--radius-md);
        padding: 6px 6px 6px 0;
      }

      .row.hovered {
        background: var(--color-edge-faint);
      }

      .grip {
        width: 20px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        padding-top: 8px;
        color: var(--color-ink-4);
      }

      .grip.hidden svg {
        visibility: hidden;
      }

      .body {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        flex: 1;
        padding: 2px 0;
      }

      /* A stop: the place thumbnail with its numeral. */
      .thumb {
        position: relative;
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        background: var(--color-surface-inset);
        display: grid;
        place-items: center;
        color: var(--color-ink-3);
      }

      .numeral {
        position: absolute;
        top: -4px;
        inset-inline-start: -4px;
        width: 16px;
        height: 16px;
        border-radius: var(--radius-full);
        background: var(--color-accent);
        color: var(--color-accent-on);
        font-size: var(--text-micro);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 2px var(--color-surface-2);
      }

      .line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }

      .name {
        flex: 1;
        min-width: 0;
        font-size: var(--text-label);
        font-weight: 600;
        color: var(--color-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .time {
        flex-shrink: 0;
        font-size: var(--text-caption);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-2);
      }

      .sub {
        margin-top: 2px;
        font-size: var(--text-caption);
        color: var(--color-ink-3);
      }

      .facts {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
      }

      .fact {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-caption);
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-3);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: var(--radius-full);
        padding: 1px 8px;
        font-size: var(--text-micro);
        font-weight: 600;
        background: var(--color-surface-inset);
        color: var(--color-ink-2);
      }

      .badge.ok {
        background: #e2f1e8;
        color: #136b45;
      }

      [data-theme='dark'] .badge.ok {
        background: #11251c;
        color: #4cc38a;
      }

      /* A note: the small icon tile, no thumbnail. */
      .note-tile {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
        border-radius: var(--radius-sm);
        background: var(--color-surface-inset);
        color: var(--color-ink-3);
        display: grid;
        place-items: center;
        margin-top: 1px;
      }

      .note-text {
        font-size: var(--text-caption);
        color: var(--color-ink-2);
      }

      /* The journey: this spec's new variant. Same grip column and same
         baseline as a stop; the mode glyph replaces the place thumbnail. */
      .journey .body {
        border-radius: var(--radius-md);
        background: var(--color-surface);
        border: 1px solid var(--color-edge-faint);
        padding: 8px 10px;
      }

      .mode {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-md);
        background: var(--color-surface-inset);
        color: var(--color-ink-2);
        display: grid;
        place-items: center;
      }

      .callout {
        margin-top: 14px;
        border-inline-start: 2px solid var(--color-brand);
        padding-inline-start: 10px;
        font-size: var(--text-caption);
        line-height: 1.45;
        color: var(--color-ink-3);
      }

      .callout b {
        color: var(--color-ink-2);
      }
    </style>
  </head>
  <body>
    <section class="theme" data-theme="light">
      <p class="theme-name">Light</p>
      <div class="rail" id="rail-light"></div>
    </section>

    <section class="theme" data-theme="dark">
      <p class="theme-name">Dark</p>
      <div class="rail" id="rail-dark"></div>
    </section>

    <script>
      const ICON = {
        grip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>',
        pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
        train:
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="13" rx="2"/><path d="M5 9h14M8 20l-2 2M16 20l2 2M7 16h.01M17 16h.01"/></svg>',
        clock:
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        ticket:
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 6 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-6Z"/><path d="M13 7v10"/></svg>',
        note: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l6-6V5a2 2 0 0 0-2-2Z"/><path d="M14 21v-5a1 1 0 0 1 1-1h5"/></svg>',
      }

      function grip(shown) {
        return `<span class="grip${shown ? '' : ' hidden'}">${ICON.grip}</span>`
      }

      function stop(n, name, place, time, duration) {
        return `<li class="row">
          ${grip(true)}
          <span class="body">
            <span class="thumb">${ICON.pin}<span class="numeral">${n}</span></span>
            <span style="min-width:0;flex:1">
              <span class="line">
                <span class="name">${name}</span>
                <span class="time">${time}</span>
              </span>
              <span class="sub">${place}</span>
              <span class="facts">
                <span class="fact">${ICON.clock}${duration}</span>
              </span>
            </span>
          </span>
        </li>`
      }

      function journey() {
        return `<li class="row journey hovered">
          ${grip(true)}
          <span class="body">
            <span class="mode">${ICON.train}</span>
            <span style="min-width:0;flex:1">
              <span class="line">
                <span class="name">Tokyo to Kyoto</span>
                <span class="time">14:05 – 16:24</span>
              </span>
              <span class="sub">Tokyo Station &rarr; Kyoto Station</span>
              <span class="facts">
                <span class="fact">${ICON.ticket}Nozomi 231</span>
                <span class="badge ok">Booked</span>
                <span class="fact">&yen;13,320</span>
              </span>
            </span>
          </span>
        </li>`
      }

      function note(time, text) {
        return `<li class="row">
          ${grip(true)}
          <span class="body">
            <span class="note-tile">${ICON.note}</span>
            <span style="min-width:0;flex:1">
              <span class="line">
                <span class="time" style="font-weight:600">${time}</span>
                <span class="note-text" style="flex:1">${text}</span>
              </span>
            </span>
          </span>
        </li>`
      }

      const rail = `
        <div class="rail-head">Itinerary</div>
        <div class="day">
          <div class="day-head">
            <span class="day-title">Day 3 &middot; Fri 18 Apr</span>
            <span class="day-meta">2 stops</span>
          </div>
          <ol>
            ${stop(1, 'Sens&#333;-ji', 'Asakusa, Taito', '09:00', '1h 30m')}
            ${note('11:40', 'Collect the rail pass before the platform gates.')}
            ${journey()}
            ${stop(2, 'Nishiki Market', 'Nakagyo, Kyoto', '17:10', '1h')}
          </ol>
          <p class="callout">
            The journey row is the third <b>PlannerItem</b> variant, in the day&rsquo;s
            one sequence &mdash; not a second list. It carries the mode glyph, both
            endpoints, the clock, the ticket and the booking status, and it is the
            only row here whose position lives in <b>transports.sort_order</b>.
          </p>
        </div>`

      document.getElementById('rail-light').innerHTML = rail
      document.getElementById('rail-dark').innerHTML = rail
    </script>
  </body>
</html>
