# Started by a person from the cockpit on one issue: om-auto-fix-issue classifies it and drives the
# whole chain (verify, root cause, fix, PR, review, QA for UI fixes) to a reviewed PR on develop
# (ADR 0018). No automation starts it: the unattended lane is issue-groom, then implement-ticket
# (ADR 0032). No bashAllowlist by design: the tracker descriptor needs shell functions and jq;
# .claude/settings.json deny rules are the gate.
name: issue-autofix
description: om-auto-fix-issue drives one issue to a reviewed draft-then-ready PR on develop; started from the cockpit.
steps:
  - id: bootstrap
    name: Provision the worktree (deps, routes, secrets, D1, basemap)
    command: bash .ai/scripts/bootstrap.sh --profile worktree --no-seed
  - id: fix
    name: om-auto-fix-issue
    prompt: '/om-auto-fix-issue {{task}}'
    # mcp__plugin_playwright_playwright: the QA step drives a browser; without it runs try to install one.
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent, mcp__plugin_playwright_playwright]
