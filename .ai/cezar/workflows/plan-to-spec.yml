# Started by the Reconciler (docs/agents/cezar.md, ADR 0033) when `node .ai/scripts/backlog-status.mjs
# --plan` lists a `write-spec` action - the first stage of docs/plans/ that no spec and no issue mentions,
# that its plan does not mark `Delivered:` and that is not in a frozen plan, while no spec waits to be
# sliced and no PR adds a spec or marks delivered stages (a branch `docs/plan-delivered-*`, until it
# merges those stages still read as uncovered) - or by a person from the cockpit with a stage.
# The task names the stage and its plan file. afk-plan-to-spec verifies the stage against the code,
# settles every open question through an independent specialist (.ai/skills/afk-decide/SKILL.md), writes
# a `ready` spec under .ai/specs/ and has a specialist panel review it. The gate, the PR and the merge
# are the same chain implement-ticket ends with: the spec PR is design-only (`skip-qa`), the develop
# ruleset requires no approving review, and om-pr-autopilot --allow-merge squash-merges it into develop
# once CI is green (ADR 0031). The next tick then slices the merged spec (spec-to-tickets).
# When the code already delivers the stage, there is no spec to write and the stage would be named
# again on every tick: the skill marks it, and every other delivered uncovered stage of the same plan,
# with a `Delivered:` line instead, the write step logs `DELIVERED:` where it would log `STOP:`, and
# the pr step opens a docs-only PR for the plan file. The merge step is the same.
# `steps` form rather than the `skills:` shorthand, because the shorthand runs with the default tool
# list, which has no `Agent`.
name: plan-to-spec
description: Write the spec for one plan stage, have a specialist panel review it, and land it on a design-only PR the pipeline merges (afk-plan-to-spec).
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    # The spec index is generated with the repository's own toolchain, so this needs dependencies.
    command: bash .ai/scripts/bootstrap.sh
  - id: write
    name: afk-plan-to-spec
    skill: afk-plan-to-spec
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
    prompt: |
      {{task}}

      Write `STAGE: <stage id>` as the first progress-log line of this run's handoff file; later steps read it. When the skill ends with delivered stages marked and committed (its step 2a) instead of a spec, write `DELIVERED: <stage ids>` as the next progress-log line, then end with CEZ:DONE. When it ends with neither a committed spec nor a committed mark - `NO_ACTION_NEEDED`, an issue filed as human-only, or a spec the panel would not approve - write `STOP: <reason>` as the next progress-log line, then end with CEZ:DONE. Later steps read that line and skip.
  - id: gate
    name: Spec gate
    command: bash .ai/scripts/check-generated.sh && pnpm vitest run scripts/specs
    onFail:
      retry: write
      max: 2
  - id: pr
    name: Open the spec or the docs PR
    skill: om-open-pr
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
    prompt: |
      {{task}}

      If a progress-log line of this run's handoff file starts with `STOP:`, end at once with CEZ:DONE.

      If a progress-log line of this run's handoff file starts with `DELIVERED:`, open the docs PR per om-open-pr and `.ai/skills/afk-plan-to-spec/SKILL.md` § 2a: branch `docs/plan-delivered-<plan-slug>`, docs-only, labels `documentation`, `skip-qa`, `priority-low` and `risk-low`, and in the body each stage id with its evidence (the `Delivered:` lines the commit added). No spec exists to link and none to index.

      Otherwise open the spec PR per om-open-pr and `.ai/skills/afk-plan-to-spec/SKILL.md` § 6: branch `spec/<slug>`, design-only, labels `review`, `documentation`, `skip-qa`, one priority and one risk, and the stage, the panel's verdicts and the Resolved assumptions table in the body. Then put the PR number in the spec's `Spec PR` row, run `pnpm generate-spec-index`, and push that as a second commit.
  - id: merge
    name: Drive the PR to the merge into develop
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
    prompt: |
      {{task}}

      End at once with CEZ:DONE if either holds:
      - a progress-log line of this run's handoff file starts with `STOP:`;
      - no PR is open for this branch (`gh pr list --head "$(git branch --show-current)"`).

      Otherwise run `/om-pr-autopilot <that PR number> --allow-merge`. The PR is design-only and `skip-qa`: no browser, no worktree provisioning. Merge only into `develop`.
