name: spec-to-tickets
description: Slice at most one merged spec into tracer-bullet tickets, each carrying its Agent Brief (spec-to-tickets).
steps:
  - id: spec-to-tickets
    name: spec-to-tickets
    prompt: |
      Read AGENTS.md and .agents/workflows/spec-to-tickets.md before acting on this task.
      {{task}}

      Slice that one spec and no other. The parent issue's body must open with `Spec: <spec path>` on its first line: that line is how the Reconciler knows the spec is sliced, and a spec without it is sliced again on the next tick. Settle every judgement call through a specialist (decision protocol); the skill lists when to stop, and `NO_ACTION_NEEDED` is the right ending when the spec already has a parent.
