name: brainstorm
description: Interactive om-brainstorm on an idea; ends with a routing decision (Next- om-prepare-issue or om-spec-writing).
steps:
  - id: bootstrap
    name: Install dependencies and generate the route tree
    command: bash .ai/scripts/bootstrap.sh
  - id: brainstorm
    name: om-brainstorm
    prompt: 'om-brainstorm {{task}}'
