# The area-plan workflow: one un-migrated area of docs/plans/ becomes a spec and then a PRD on
# one GitHub issue, in one run and without a human in the loop (ADR 0017). Start it from the
# cockpit: GitHub tab -> the issue that will hold the PRD -> "Hand this to the agent" -> workflow
# `plan-area`, prompt template `plan-area` with the plan file filled in
# (`area docs/plans/05-packing-and-todos.md`). The Autonomous flag changes nothing: the skill
# never asks, and a decision the panel cannot settle stays an open question the human grills
# afterwards with `plan` in mode `prd`.
#
# Same shape as plan.yml: two deterministic command steps, then the one agent step. The panel of
# subagents lives in .claude/agents/plan-*.md and reaches tools only through this step's lists;
# scripts/agent/__tests__/plan-area.test.ts keeps the two in agreement.
name: plan-area
description: Spec then PRD for one docs/plans area on one issue, decided by the orchestrator over a panel of project subagents; the issue ends at status review.
steps:
  - id: claim
    name: Claim the issue
    command: scripts/agent/cez-plan-claim.sh
  - id: setup
    name: Install and generate routes
    command: scripts/agent/cez-setup.sh --no-e2e
  - id: plan
    name: Plan with the panel
    prompt: '/plan-area {{task}}'
    model: opus
    allowedTools: [Read, Grep, Glob, Edit, Write, Bash, Skill, TodoWrite, Agent]
    bashAllowlist:
      - gh issue view
      - gh issue list
      - gh pr list
      - git status
      - git diff
      - git log
      - git add CONTEXT.md
      - git add docs/adr
      - git commit
      - scripts/agent/gh-ro.sh
      - scripts/agent/publish-spec.sh
      - scripts/agent/publish-prd.sh
      - scripts/agent/cez-docs-pr.sh
      - scripts/agent/cez-plan-handback.sh
