name: housekeeping
description: Reconcile merged issues and report exceptions with missing evidence.
steps:
  - id: close-fixed
    name: Reconcile issues fixed by merged PRs
    command: node scripts/agents/close-fixed-issues.mjs --apply --checkpoint
  - id: exceptions
    name: Report unresolved pipeline states
    command: node .ai/scripts/backlog-status.mjs --json
