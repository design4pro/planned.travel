name: housekeeping
description: Report merged-issue candidates and reconcile them under atomic Open Mercato ownership.
steps:
  - id: report
    command: node scripts/agents/close-fixed-issues.mjs
  - id: reconcile
    prompt: |
      Read AGENTS.md and apply om-close-fixed-issues {{task}}.
      Follow the current atomic ownership protocol and preserve human holds.
      Never call the legacy deterministic helper with --apply or release claims by age/login.
      Do not launch implementation, PR review or merge work from this sweep.
