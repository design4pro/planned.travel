version: 2
name: idea-to-spec
description: 'Human-written brief -> design-only specification -> independent review panel + judge -> human spec acceptance. Plan+Design stages of the AI-native SDLC. om-brainstorm is interactive and runs BEFORE this graph. Cezar owns git/PR; agents only edit the worktree. Every port is wired, every cycle is bounded.'
nodes:
  - id: start
    type: start

  # ---------- INTAKE ----------
  # Task input: the repo-relative path of a brief file, or the number of a feature issue whose body
  # is the brief (made with the interactive om-brainstorm skill, which must not run inside this
  # autonomous graph). This repository keeps no briefs directory: the brief stays outside
  # .ai/specs/, and only the spec is committed.
  - id: intake
    name: 'Check brief'
    type: agent
    skill: om-spec-writing
    verdicts: [ready, incomplete]
    prompt: |-
      Brief: {{task}}
      Read-only. Do not edit files.
      1. The brief (a readable file, or a GitHub issue: gh issue view) states intent, scope and
         non-goals in the human's words. Humans own intent, scope and non-goals: if any is missing
         or ambiguous, the brief is incomplete. Never invent them.
      2. Facts are yours to check, not to ask about: read CONTEXT.md, docs/SPEC.md, the ADRs in
         docs/adr/ for the area, docs/plans/ and the existing specs in .ai/specs/ (also
         implemented/ and archived/), and run `node .ai/scripts/backlog-status.mjs` for the issues
         already open. Note overlaps, conflicts and the specs the new one must link to.
      3. Check that no spec for this brief already exists (.ai/specs/, open spec PRs).
      Summarize the verified facts and list every question the brief leaves open. Classify each as
      FACT (resolved by you now, give the evidence), REVERSIBLE (low-risk, to be decided after the
      review panel) or HIGH-RISK (intent, scope, non-goals, auth, sessions, money, data scoping,
      migrations, shared contracts - only a human decides).
      End with exactly one line: CEZ:VERDICT ready | incomplete

  # ---------- DRAFT ----------
  - id: draft
    name: 'Draft specification'
    type: agent
    skill: om-spec-writing
    prompt: |-
      Brief: {{task}}
      Verified facts and classified questions:
      {{nodes.intake.summary}}
      Write the specification autonomously (om-spec-writing --autonomous building blocks, as used
      by om-auto-write-spec, but WITHOUT opening a PR): skeleton first, with an Open Questions
      section and an (initially empty) Resolved assumptions section, market-leader research, and an implementation breakdown into phases and steps.
      Save it as .ai/specs/<YYYY-MM-DD>-<slug>.md (the root of .ai/specs/, never implemented/ or
      archived/), with the metadata table directly under the H1 exactly as .ai/specs/AGENTS.md
      describes (Status draft, Issue, Spec PR none, Implementation none), the two sections this
      repository requires of every spec ("Visual change expected" and "Copy", see
      .ai/skills/om-auto-write-spec/SKILL.md), and links to the related specs and ADRs. Then run
      `pnpm generate-spec-index`; the index is generated, never hand-edited.
      Rules:
      - Design only. Do NOT edit the brief, the issues or any source code: specs precede the
        tickets afk-to-tickets slices from them, and implementation PRs stay separate.
      - Do not decide HIGH-RISK questions; keep them under Open Questions, marked HIGH-RISK.
      - Work only in the current directory (Cezar gave you an isolated worktree). Do not create
        another worktree, commit, push, open a PR, or touch labels.
      - Write in English. Do not invent validation commands.

  # Deterministic gate between draft and panel: only specs changed, structure present.
  - id: specgate
    name: 'Spec structure gate'
    type: check
    command: &speccheck |-
      node -e '
      const { execSync } = require("child_process"), fs = require("fs");
      const files = execSync("git status --porcelain --untracked-files=all").toString()
        .split("\n").filter(Boolean).map((l) => l.slice(3));
      const bad = [];
      if (!files.length) bad.push("no files changed");
      for (const f of files) {
        if (!/^\.ai\/specs\/[^/]+\.md$/.test(f))
          bad.push("out of scope for a design-only spec change: " + f);
      }
      const specs = files.filter((f) => /^\.ai\/specs\/[^/]+\.md$/.test(f) && f !== ".ai/specs/README.md");
      if (!specs.length) bad.push("no specification file changed");
      if (specs.length && !files.includes(".ai/specs/README.md")) bad.push("spec index not regenerated: run pnpm generate-spec-index");
      for (const f of specs) {
        const t = fs.existsSync(f) ? fs.readFileSync(f, "utf8") : "";
        if (!/^\|\s*\*\*Status\*\*\s*\|\s*(draft|ready)\s*\|/im.test(t)) bad.push(f + ": missing metadata table with Status draft or ready (.ai/specs/AGENTS.md)");
        if (!/^#+\s*Visual change expected/im.test(t)) bad.push(f + ": missing Visual change expected section");
        if (!/^#+\s*Copy/im.test(t)) bad.push(f + ": missing Copy section");
        if (!/^#+\s*Open Questions/im.test(t)) bad.push(f + ": missing Open Questions section");
        if (!/^#+\s*Resolved assumptions/im.test(t)) bad.push(f + ": missing Resolved assumptions section");
        if (/\b(TBD|TODO|FIXME)\b/.test(t)) bad.push(f + ": contains TBD/TODO/FIXME");
      }
      if (bad.length) { console.log(bad.join("\n")); process.exit(1); }
      console.log("ok: " + specs.join(", "));
      '

  - id: rounds
    name: 'Revision rounds'
    type: loop
    max: 3

  - id: revise
    name: 'Revise specification'
    type: agent
    skill: om-spec-writing
    session:
      continue: draft
    prompt: |-
      Revision round {{nodes.rounds.iteration}}/{{nodes.rounds.max}}.
      Structure gate output (empty when it passed): {{nodes.specgate.output}}
      Review panel consolidation (empty before the first review): {{nodes.judge.summary}}
      Human answer to the high-risk question (empty if none was asked): {{nodes.askhuman.answer}}
      Fix every Critical and Important finding in the specification only. Same rules as before:
      design only, no backlog edit, no commit, no push. Do not paper over a finding by deleting
      the requirement it concerns.

  # ---------- INDEPENDENT REVIEW PANEL ----------
  - id: panel
    name: 'Review panel'
    type: fork
    branches: 3
  - id: lensdesign
    name: 'Correctness + architecture'
    type: agent
    review: true
    prompt: |-
      Review the specification drafted for: {{task}} (git status; git diff HEAD; the file is named in:
      {{nodes.draft.summary}}). You did not write it. Your lens: correctness and architecture -
      contradictions with CONTEXT.md, docs/SPEC.md, the ADRs and related specs, wrong or missing
      boundaries, shared-contract impact, unrealistic phases, dependency gaps in the breakdown.
      Report only real problems, each with file and line, ranked Critical / Important / Nit, and
      say plainly when you found none. For each Open Question say whether it is FACT,
      REVERSIBLE or HIGH-RISK and whether you agree with the draft's classification.
  - id: lenssecurity
    name: 'Security + risk'
    type: agent
    review: true
    prompt: |-
      Review the specification drafted for: {{task}} (git status; git diff HEAD; the file is named in:
      {{nodes.draft.summary}}). You did not write it. Your lens: security and risk - auth,
      sessions, data scoping, money, secrets, migrations, shared contracts, abuse cases. State
      whether the change is risk-high per SDLC.md and what evidence a high-risk implementation
      would need. Report only real problems, each with file and line, ranked Critical / Important /
      Nit, and say plainly when you found none. Flag any HIGH-RISK decision the draft made on its
      own instead of leaving it to a human.
  - id: lenstest
    name: 'Testability + WCAG'
    type: agent
    review: true
    prompt: |-
      Review the specification drafted for: {{task}} (git status; git diff HEAD; the file is named in:
      {{nodes.draft.summary}}). You did not write it. Your lens: testability and accessibility -
      every requirement has an observable acceptance criterion, unit / integration / Playwright
      coverage is identified, UI requirements meet WCAG 2.2 AA, responsive behavior is stated.
      Report only real problems, each with file and line, ranked Critical / Important / Nit, and
      say plainly when you found none.
  - id: reports
    name: 'All reports'
    type: join
    wait: all

  - id: judge
    name: 'Judge'
    type: agent
    verdicts: [accept, revise, ask]
    prompt: |-
      Three independent reviewers checked the specification for: {{task}}.

      ## Correctness + architecture ({{nodes.lensdesign.status}})
      {{nodes.lensdesign.summary}}

      ## Security + risk ({{nodes.lenssecurity.status}})
      {{nodes.lenssecurity.summary}}

      ## Testability + WCAG ({{nodes.lenstest.status}})
      {{nodes.lenstest.summary}}

      Read-only. Consolidate: drop duplicates and non-problems, keep dissent visible with who
      disagreed. Apply the question policy to every open question:
      - FACT: verify it yourself from the repository; it never goes to a human.
      - REVERSIBLE and low-risk: decide it now. List each as: question, decision, rationale, and
        any dissent (the panel will record these under "Resolved assumptions").
      - HIGH-RISK (intent, scope, non-goals, auth, sessions, money, data scoping, migrations,
        shared contracts): never decide. List the one most blocking question with options.
      Verdict:
      - revise: any Critical or Important finding remains. List exactly what must change.
      - ask: no such finding, but a HIGH-RISK question needs a human answer first. Put that single
        question with its options at the top of your summary.
      - accept: no Critical or Important finding and no unanswered HIGH-RISK question.
      End with exactly one line: CEZ:VERDICT accept | revise | ask

  - id: askhuman
    name: 'Ask the human'
    type: ask-user
    question: '{{nodes.judge.summary}}'
    timeoutMs: 86400000

  # ---------- RECORD ----------
  - id: record
    name: 'Record resolved assumptions'
    type: agent
    skill: om-spec-writing
    session:
      continue: draft
    prompt: |-
      The review panel accepted the specification. Judge consolidation:
      {{nodes.judge.summary}}
      Add or update a "Resolved assumptions" section in the specification: one entry per reversible
      question decided after the panel (question, decision, rationale, dissent with who disagreed).
      Move answered questions out of Open Questions; leave unanswered HIGH-RISK ones in place.
      Do not change requirements. Run `pnpm generate-spec-index` after editing. Do not commit or push.

  - id: finalcheck
    name: 'Final spec gate'
    type: check
    command: *speccheck

  # ---------- PR + HUMAN ACCEPTANCE ----------
  - id: commit
    name: 'Commit specification'
    type: git.commit
    message: 'docs(spec): add specification drafted from brief'
  - id: push
    name: 'Push branch'
    type: git.push
  # Guards against push.default=upstream landing the commit on the wrong branch (AGENTS.md, Git).
  - id: pushguard
    name: 'Verify push target'
    type: check
    command: |-
      b=$(git branch --show-current)
      test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$b" | cut -f1)"
  - id: openpr
    name: 'Open draft PR'
    type: github.draft-pr

  - id: accept
    name: 'Spec acceptance'
    type: gate.human
    message: |-
      Spec review panel and judge accepted the specification for: {{task}}.
      Review the draft PR (design-only: no tickets, no code). Approve only if the intent, scope and
      non-goals match your brief and the Resolved assumptions are acceptable.

      Judge summary:
      {{nodes.judge.summary}}
    timeoutMs: 604800000

  - id: prready
    name: 'Mark PR ready'
    type: github.pr-update
    ready: true

  - id: labels
    name: 'Apply SDLC labels'
    type: agent
    prompt: |-
      The design-only spec PR for the current branch is ready (gh pr view). Apply the SDLC.md label
      set using only labels from .ai/agentic.config.json: exactly one pipeline label (review),
      category documentation, skip-qa, one priority and one risk (risk-high if the spec touches
      src/server/auth, src/server/repos/base.ts, src/server/billing, src/server/db/schema.ts,
      drizzle/ or src/server/public; SDLC.md "Risk here"). Leave a short
      comment explaining the choices. Do not change files. Do not approve or merge.

  # ---------- ESCALATION + ENDS ----------
  - id: escalate
    name: 'Escalate to human'
    type: agent
    prompt: |-
      The autonomous run stopped. Brief: {{task}}
      Last known outputs:
      intake: {{nodes.intake.summary}}
      structure gate: {{nodes.specgate.output}}
      judge: {{nodes.judge.summary}}
      final gate: {{nodes.finalcheck.output}}
      human decision: {{nodes.accept.comment}}
      Write ONE concise note (comment on the PR if one exists: gh pr view; otherwise print it)
      saying where it stopped, why, and the next human action. Do not edit files and do not
      add labels beyond blocked when a PR exists and the stop is a real defect.

  - id: done
    name: 'Spec accepted'
    type: end
    status: success
  - id: needshuman
    name: 'Needs human'
    type: end
    status: failed

edges:
  - { from: start.next, to: intake }
  - { from: intake.ready, to: draft }
  - { from: intake.incomplete, to: needshuman }
  - { from: intake.failed, to: escalate }

  - { from: draft.done, to: specgate }
  - { from: draft.failed, to: escalate }
  - { from: specgate.pass, to: panel }
  - { from: specgate.fail, to: rounds }
  - { from: rounds.repeat, to: revise }
  - { from: rounds.exhausted, to: escalate }
  - { from: revise.done, to: specgate }
  - { from: revise.failed, to: escalate }

  - { from: panel.1, to: lensdesign }
  - { from: panel.2, to: lenssecurity }
  - { from: panel.3, to: lenstest }
  - { from: lensdesign.done, to: reports }
  - { from: lenssecurity.done, to: reports }
  - { from: lenstest.done, to: reports }
  - { from: reports.done, to: judge }
  - { from: reports.failed, to: escalate }

  - { from: judge.accept, to: record }
  - { from: judge.revise, to: rounds }
  - { from: judge.ask, to: askhuman }
  - { from: judge.failed, to: escalate }
  - { from: askhuman.answered, to: rounds }
  - { from: askhuman.timeout, to: escalate }

  - { from: record.done, to: finalcheck }
  - { from: record.failed, to: escalate }
  - { from: finalcheck.pass, to: commit }
  - { from: finalcheck.fail, to: escalate }

  - { from: commit.done, to: push }
  - { from: commit.nothing, to: escalate }
  - { from: commit.failed, to: escalate }
  - { from: push.done, to: pushguard }
  - { from: push.failed, to: escalate }
  - { from: pushguard.pass, to: openpr }
  - { from: pushguard.fail, to: escalate }
  - { from: openpr.created, to: accept }
  - { from: openpr.failed, to: escalate }

  - { from: accept.approve, to: prready }
  - { from: accept.reject, to: escalate }
  - { from: accept.timeout, to: escalate }
  - { from: prready.done, to: labels }
  - { from: prready.failed, to: escalate }
  - { from: labels.done, to: done }
  - { from: labels.failed, to: escalate }

  - { from: escalate.done, to: needshuman }
  - { from: escalate.failed, to: needshuman }
