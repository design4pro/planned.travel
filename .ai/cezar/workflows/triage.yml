name: triage
description: Triage one GitHub issue unattended - verify, then write an Agent Brief or put a hold on it (triage).
steps:
  - id: triage
    name: triage
    prompt: |
      Read AGENTS.md and .agents/workflows/triage.md before acting on this task.
      {{task}}

      Triage that one issue and no other. Settle every judgement call through a specialist (decision protocol), and put a hold only on what decision protocol § 5 reserves for a person, in a comment whose first line is `🤖 HUMAN-ONLY: <what a person must do>`. The skill lists when to stop; stop with NO_ACTION_NEEDED rather than guess.
