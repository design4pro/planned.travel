# `steps` form rather than the `skills:` shorthand, because the shorthand runs with the default
# tool list, which has no `Agent`: the skill settles open questions through an independent
# specialist sub-agent (.ai/skills/afk-decide/SKILL.md, SDLC.md § Delegated decisions).
# Started by a person from the cockpit; the automations run afk-triage as the second step of
# issue-groom (ADR 0032).
name: triage
description: Triage one GitHub issue unattended - verify, then write an Agent Brief or put a hold on it (afk-triage).
steps:
  - id: afk-triage
    name: afk-triage
    skill: afk-triage
    prompt: '{{task}}'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
