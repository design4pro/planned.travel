# Manual follow-up for assessed review findings. Never re-arm automatically.
# The run claims the PR, fixes findings, reviews the resulting SHA and never merges.
name: pr-fix
description: Unresolved review threads on a PR; om-auto-fix-pr drives it to merge-ready and resolves them.
steps:
  - id: bootstrap
    name: Provision the worktree (deps, routes, secrets, D1, basemap)
    command: bash scripts/worktree/bootstrap.sh --profile worktree --no-seed
  - id: fix
    name: om-auto-fix-pr
    prompt: '/om-auto-fix-pr {{task}}'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
