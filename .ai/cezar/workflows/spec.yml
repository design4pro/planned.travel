name: spec
description: om-auto-write-spec turns one feature issue into a spec file on a design-only PR; started from the cockpit.
steps:
  - id: bootstrap
    name: Install dependencies and generate routes
    # Design-only work needs no secrets, D1 or basemap; implementation and QA provision separately.
    command: bash .ai/scripts/bootstrap.sh
  - id: spec
    name: om-auto-write-spec
    prompt: 'om-auto-write-spec {{task}}'
