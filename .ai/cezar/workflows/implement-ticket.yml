name: implement-ticket
description: Implement one ready-for-agent issue test-first from its Agent Brief, pass the validation gate, open a PR and drive it through review, QA and CI to the squash-merge into develop.
steps:
  - id: implement
    name: Check readiness and implement
    skill: om-fix
    # Agent: open questions go to an independent specialist sub-agent (.ai/skills/afk-decide/SKILL.md).
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent]
    prompt: |
      {{task}}

      This workflow has no om-root-cause step: the issue's `## Agent Brief` comment is your brief.

      Check readiness before claiming. Stop without changing anything if any of these hold:
      - the issue is closed, or carries `in-progress`, `ready-for-human`, `needs-info` or `blocked`;
      - it has no Agent Brief comment;
      - an issue listed under "Blocked by" is still open;
      - three or more open PRs labeled `review` are authored by the current `gh` user (WIP limit).
      To stop: write `STOP: <reason>` as the first progress-log line of this run's handoff file, then end with CEZ:DONE. Later steps read that line and skip.

      Otherwise implement per om-fix, with these rules:
      - When the brief's deliverable is a spec (afk-triage briefs a request too large for a few slices that way), write that spec under `.ai/specs/` in the shape of the existing specs instead of code; `afk-to-tickets` slices it once it merges.
      - Test first at the brief's Test seam, through the module's interface: write the failing test, see it fail, then make it pass (afk-codebase-design).
      - Build one complete vertical slice, inside the acceptance criteria and "Out of scope".
      - Use CONTEXT.md terms. Add or update entries for any concept you introduce or rename (afk-domain-modeling).
      - Settle each decision the brief left open through `.ai/skills/afk-decide/SKILL.md` instead of stopping, and record each verdict as a Resolved assumptions row in the handoff file, for the PR body.
      - For a `risk-high` or `security` issue, the brief must carry the security and tenancy specialist's approving verdict; meet its CONDITIONS as acceptance criteria. Without that verdict, get one through `afk-decide` before claiming. If the specialist does not approve, STOP: do not claim, and label the issue `ready-for-human` with the verdict.
      - A lesson worth keeping goes in a `## Lessons` section of the handoff file and the PR body, never into files outside the repository; `afk-lessons` collects it.
  - id: gate
    name: Validation gate
    command: (test -d node_modules || pnpm install --frozen-lockfile) && pnpm typecheck && pnpm lint && pnpm test && bash .ai/scripts/check-generated.sh && pnpm build
    onFail:
      retry: implement
      max: 2
  - id: pr
    name: Open the PR
    skill: om-open-pr
    prompt: |
      {{task}}

      If the first progress-log line of this run's handoff file starts with `STOP:`, end at once with CEZ:DONE.

      Otherwise open the PR per om-open-pr, with the issue number from the task as the issue id. Put the Resolved assumptions table from the handoff file in the PR body, and reference the issue with `Fixes #<number>`.
  # The chain does not stop at an open PR: om-pr-autopilot reviews, fixes, runs QA, waits for CI and
  # squash-merges into develop (ADR 0031) - the develop ruleset requires no approving review. It
  # never merges the develop -> main promotion, and a `risk-high` PR waits for the owner's
  # `qa-approved`.
  - id: merge
    name: Drive the PR to the merge into develop
    # mcp__plugin_playwright_playwright: the QA step drives a browser; without it runs try to install one.
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent, mcp__plugin_playwright_playwright]
    prompt: |
      {{task}}

      End at once with CEZ:DONE if either holds:
      - the first progress-log line of this run's handoff file starts with `STOP:`;
      - no PR is open for this branch (`gh pr list --head "$(git branch --show-current)"`).

      Otherwise run `/om-pr-autopilot <that PR number> --allow-merge`:
      - Before QA needs the app, provision the worktree with `bash scripts/worktree/bootstrap.sh --profile worktree --no-seed`.
      - Review reports the Standards axis and the Spec axis separately (CODE_REVIEW.md), and the Spec axis checks each acceptance criterion from the issue's Agent Brief.
      - Merge only into `develop`.
