# A human opened a pull request, or an agent pull request reached `merge-queue` (the "Autopilot new
# pull requests" and "Merge reviewed agent pull requests" automations filter on authors and labels).
# om-pr-autopilot diagnoses it and runs the right chain: continue, fix, review, QA, and with
# `--allow-merge` the final om-approve-merge-pr squash-merge, which still refuses on a failed QA gate
# or `qa-failed` / `do-not-merge` / `blocked` (ADR 0031). The develop-to-main promotion PR never
# reaches this workflow: it carries `promotion`, which every PR automation excludes.
name: pr-autopilot
description: om-pr-autopilot on one PR - diagnose, then continue / fix / review / QA / merge to develop.
steps:
  - id: bootstrap
    name: Provision the worktree (deps, routes, secrets, D1, basemap)
    command: bash scripts/worktree/bootstrap.sh --profile worktree --no-seed
  - id: autopilot
    name: om-pr-autopilot
    prompt: '/om-pr-autopilot {{task}} --allow-merge'
    # mcp__plugin_playwright_playwright: the QA step drives a browser; without it runs try to install one.
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, TodoWrite, Agent, mcp__plugin_playwright_playwright]
