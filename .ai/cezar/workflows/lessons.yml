name: lessons
description: Review repeated delivery failures with Open Mercato and propose at most one repair PR.
steps:
  - id: retrospective
    prompt: |
      Read AGENTS.md, then run om-pipeline-retro for {{task}}.
      Use concrete evidence from the last fourteen days. A quiet period is a no-op.
      Repeated failures may become regression tests or a correction to the owning rule.
      Open at most one draft PR; do not merge it or create a second delivery owner.
